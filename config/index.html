<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XRS Hero — Configurador de Escenas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0e0e0e;
            --surface: #1a1a1a;
            --surface-2: #232323;
            --surface-3: #2e2e2e;
            --border: #3a3a3a;
            --text: #e2e2e2;
            --text-dim: #888;
            --accent: #e7bf9c;
            --accent-dim: rgba(231,191,156,0.15);
            --green: #3de273;
            --red: #e23d5e;
            --blue: #3d9ee2;
            --font: 'Inter', sans-serif;
        }
        html { font-size: 14px; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 18px;
            vertical-align: middle;
        }

        /* ── Layout ── */
        .sidebar {
            width: 440px;
            min-width: 440px;
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
        .sidebar-header h1 span { color: var(--accent); }
        .sidebar-actions { display: flex; gap: 6px; align-items: center; }
        .sync-status {
            font-size: 0.7rem;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
        }
        .sync-status.error { color: var(--red); }
        .sync-status .material-symbols-outlined { font-size: 14px; }

        .sidebar-body { flex: 1; overflow-y: auto; }

        .preview-area {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text); font-family: var(--font);
            font-size: 0.78rem; font-weight: 500; cursor: pointer;
            transition: all 150ms; white-space: nowrap;
        }
        .btn:hover { background: var(--surface-3); border-color: #555; }
        .btn-accent { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
        .btn-accent:hover { opacity: 0.9; background: var(--accent); }
        .btn-sm { padding: 4px 8px; font-size: 0.72rem; }
        .btn-danger { color: var(--red); }
        .btn-danger:hover { background: rgba(226,61,94,0.1); border-color: var(--red); }
        .btn-ghost { border: none; background: transparent; padding: 4px 6px; }
        .btn-ghost:hover { background: var(--surface-3); }

        /* ── Config Section ── */
        .config-section { border-bottom: 1px solid var(--border); padding: 16px 20px; }
        .config-section-title {
            font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 12px;
        }
        .config-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .config-row:last-child { margin-bottom: 0; }
        .config-label { font-size: 0.82rem; font-weight: 500; }
        .config-label small { display: block; color: var(--text-dim); font-weight: 400; font-size: 0.72rem; margin-top: 1px; }
        .config-input {
            width: 76px; padding: 5px 8px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text); font-family: var(--font); font-size: 0.82rem; text-align: right;
        }
        .config-input:focus { outline: none; border-color: var(--accent); }

        /* ── Scenes ── */
        .scene-list { list-style: none; }
        .scene-item { border-bottom: 1px solid var(--border); }
        .scene-item.active { background: var(--accent-dim); }
        .scene-header {
            display: flex; align-items: center; padding: 12px 20px;
            cursor: pointer; gap: 10px; user-select: none;
        }
        .scene-header:hover { background: rgba(255,255,255,0.02); }
        .scene-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .scene-name { flex: 1; font-weight: 600; font-size: 0.82rem; }
        .scene-range { font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .scene-toggle { color: var(--text-dim); transition: transform 200ms; }
        .scene-item.open .scene-toggle { transform: rotate(180deg); }
        .scene-body { display: none; padding: 0 20px 16px; }
        .scene-item.open .scene-body { display: block; }

        /* ── Fields ── */
        .field-group { margin-bottom: 12px; }
        .field-label {
            display: block; font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--text-dim); margin-bottom: 5px;
        }
        .field-row { display: flex; gap: 8px; align-items: center; }
        .field-input {
            flex: 1; padding: 7px 10px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text); font-family: var(--font); font-size: 0.82rem;
        }
        .field-input:focus { outline: none; border-color: var(--accent); }
        textarea.field-input { resize: vertical; min-height: 48px; line-height: 1.4; }
        .field-input-sm { width: 64px; flex: none; text-align: center; }
        .field-select {
            padding: 7px 10px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text); font-family: var(--font); font-size: 0.82rem; cursor: pointer;
        }
        .field-select:focus { outline: none; border-color: var(--accent); }

        /* ── Range visual ── */
        .range-bar {
            height: 6px; background: var(--surface-3); border-radius: 3px;
            margin-bottom: 8px; position: relative; overflow: hidden;
        }
        .range-bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

        /* ── Toggle ── */
        .toggle {
            position: relative; width: 34px; height: 18px;
            background: var(--surface-3); border-radius: 9px; cursor: pointer;
            transition: background 200ms; border: 1px solid var(--border); flex-shrink: 0;
        }
        .toggle.on { background: var(--accent); border-color: var(--accent); }
        .toggle::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border-radius: 50%; background: #fff; top: 2px; left: 2px;
            transition: transform 200ms;
        }
        .toggle.on::after { transform: translateX(16px); }

        /* ── Module (text block inside scene) ── */
        .module-list { display: flex; flex-direction: column; gap: 6px; }
        .module-item {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden;
        }
        .module-item.open { border-color: rgba(231,191,156,0.3); }
        .module-header {
            display: flex; align-items: center; padding: 8px 12px;
            cursor: pointer; gap: 8px; font-size: 0.78rem; font-weight: 500;
        }
        .module-header:hover { background: rgba(255,255,255,0.02); }
        .module-type-badge {
            font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; padding: 2px 6px; border-radius: 3px;
            background: var(--surface-3); color: var(--text-dim);
        }
        .module-header .module-name { flex: 1; }
        .module-body { display: none; padding: 10px 12px; border-top: 1px solid var(--border); }
        .module-item.open .module-body { display: block; }
        .module-actions {
            display: flex; gap: 4px; align-items: center;
        }
        .add-module-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px; border: 1px dashed var(--border);
            border-radius: 6px; background: transparent; color: var(--accent);
            font-family: var(--font); font-size: 0.78rem; font-weight: 500;
            cursor: pointer; margin-top: 6px;
        }
        .add-module-btn:hover { background: var(--accent-dim); border-color: var(--accent); }

        .add-scene-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px; border: none; background: transparent;
            color: var(--accent); font-family: var(--font); font-size: 0.82rem;
            font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border);
        }
        .add-scene-btn:hover { background: var(--accent-dim); }

        /* ── Timeline ── */
        .timeline-bar { padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); }
        .timeline-track {
            position: relative; height: 44px; background: var(--surface-2);
            border-radius: 6px; border: 1px solid var(--border); overflow: hidden;
        }
        .timeline-scene {
            position: absolute; top: 4px; bottom: 4px; border-radius: 4px;
            opacity: 0.6; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 0.6rem; font-weight: 700;
            color: rgba(0,0,0,0.7); transition: opacity 150ms;
        }
        .timeline-scene:hover, .timeline-scene.active { opacity: 1; }
        .timeline-playhead {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: #fff; z-index: 5; pointer-events: none;
        }
        .timeline-ticks { display: flex; justify-content: space-between; padding: 3px 0 0; }
        .timeline-ticks span { font-size: 0.58rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }

        /* ── Preview ── */
        .preview-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
        #previewCanvas { width: 100%; height: 100%; display: block; }
        .preview-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background: linear-gradient(135deg, rgba(19,19,19,0.75) 0%, rgba(19,19,19,0.4) 40%, rgba(19,19,19,0.15) 100%);
        }
        .preview-text-block {
            position: absolute; z-index: 10; max-width: 600px; padding: 0 32px;
        }
        .preview-text-block h1 {
            font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em;
            line-height: 1.05; margin-bottom: 10px;
        }
        .preview-text-block h2 {
            font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em;
            line-height: 1.08; margin-bottom: 8px;
        }
        .preview-text-block p {
            color: #b0a090; font-weight: 300; line-height: 1.5; font-size: 0.95rem;
        }
        .preview-text-block .ptag {
            display: block; color: var(--accent); font-size: 0.65rem;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 10px;
        }
        .preview-text-block .pbtn {
            display: inline-block; margin-top: 12px; padding: 12px 28px;
            background: var(--accent); color: #1a1a1a; font-weight: 700;
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em;
            border-radius: 2px;
        }

        /* ── Preview Controls ── */
        .preview-controls {
            position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; z-index: 20;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(12px);
            padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08);
        }
        .preview-controls .btn { border: none; background: transparent; color: #fff; padding: 5px 8px; border-radius: 16px; }
        .preview-controls .btn:hover { background: rgba(255,255,255,0.1); }
        .preview-progress { position: absolute; bottom: 52px; left: 20px; right: 20px; z-index: 20; }
        .progress-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; cursor: pointer; position: relative;
        }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
        .progress-handle {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); top: 50%; transform: translate(-50%, -50%);
            cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .preview-frame-info {
            position: absolute; top: 12px; right: 12px; z-index: 20;
            font-size: 0.7rem; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.45); padding: 3px 8px; border-radius: 4px;
        }

        /* ── Modal ── */
        .modal-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto;
        }
        .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal pre {
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; font-size: 0.78rem; overflow-x: auto;
            white-space: pre-wrap; word-break: break-all; max-height: 50vh; line-height: 1.6;
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- ═══ SIDEBAR ═══ -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1><span>XRS</span> Hero Config</h1>
            <div class="sidebar-actions">
                <div class="sync-status" id="syncStatus">
                    <span class="material-symbols-outlined">cloud_done</span> Synced
                </div>
                <button class="btn btn-sm" onclick="resetConfig()" title="Reset">
                    <span class="material-symbols-outlined">restart_alt</span>
                </button>
                <button class="btn btn-sm" onclick="showExportModal()" title="Exportar JSON">
                    <span class="material-symbols-outlined">code</span>
                </button>
                <button class="btn btn-sm btn-accent" onclick="saveToFirebase()" title="Guardar en Firebase">
                    <span class="material-symbols-outlined">cloud_upload</span> Guardar
                </button>
            </div>
        </div>

        <div class="sidebar-body">
            <!-- Global Config -->
            <div class="config-section">
                <div class="config-section-title">General</div>
                <div class="config-row">
                    <div class="config-label">Altura scroll <small>Multiplicador viewport</small></div>
                    <input type="number" class="config-input" id="cfgScrollHeight" value="5" min="2" max="15" step="0.5" onchange="updateGlobal('scrollHeight',parseFloat(this.value))" />
                </div>
                <div class="config-row">
                    <div class="config-label">Total frames</div>
                    <input type="number" class="config-input" id="cfgFrameCount" value="168" min="1" max="500" onchange="updateGlobal('frameCount',parseInt(this.value));preloadFrames()" />
                </div>
                <div class="config-row">
                    <div class="config-label">Fade duración <small>0-1 del scroll</small></div>
                    <input type="number" class="config-input" id="cfgFadeDuration" value="0.04" min="0.01" max="0.2" step="0.005" onchange="updateGlobal('fadeDuration',parseFloat(this.value))" />
                </div>
                <div class="config-row">
                    <div class="config-label">Translate Y <small>px de slide-up</small></div>
                    <input type="number" class="config-input" id="cfgTranslateY" value="40" min="0" max="120" step="5" onchange="updateGlobal('translateY',parseInt(this.value))" />
                </div>
                <div class="config-row">
                    <div class="config-label">Overlay opacidad</div>
                    <input type="number" class="config-input" id="cfgOverlayOpacity" value="0.75" min="0" max="1" step="0.05" onchange="updateGlobal('overlayOpacity',parseFloat(this.value))" />
                </div>
            </div>

            <!-- Scenes -->
            <div style="padding:16px 20px 8px;">
                <div class="config-section-title" style="margin-bottom:0;">Escenas</div>
            </div>
            <ul class="scene-list" id="sceneList"></ul>
            <button class="add-scene-btn" onclick="addScene()">
                <span class="material-symbols-outlined">add</span> Agregar escena
            </button>
        </div>
    </div>

    <!-- ═══ PREVIEW ═══ -->
    <div class="preview-area">
        <div class="preview-canvas-wrap">
            <canvas id="previewCanvas"></canvas>
            <div class="preview-overlay" id="previewOverlay"></div>
            <div id="previewTextContainer"></div>
            <div class="preview-frame-info" id="frameInfo">Frame 1 / 168 — 0%</div>
        </div>
        <div class="preview-controls">
            <button class="btn" onclick="jumpTo(0)"><span class="material-symbols-outlined">skip_previous</span></button>
            <button class="btn" onclick="stepBack()"><span class="material-symbols-outlined">fast_rewind</span></button>
            <button class="btn" id="btnPlay" onclick="togglePlay()"><span class="material-symbols-outlined">play_arrow</span></button>
            <button class="btn" onclick="stepForward()"><span class="material-symbols-outlined">fast_forward</span></button>
            <button class="btn" onclick="jumpTo(1)"><span class="material-symbols-outlined">skip_next</span></button>
        </div>
        <div class="preview-progress">
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-handle" id="progressHandle"></div>
            </div>
        </div>
        <div class="timeline-bar">
            <div class="timeline-track" id="timelineTrack"></div>
            <div class="timeline-ticks">
                <span>0%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span>
                <span>50%</span><span>60%</span><span>70%</span><span>80%</span><span>90%</span><span>100%</span>
            </div>
        </div>
    </div>

    <!-- ═══ EXPORT MODAL ═══ -->
    <div class="modal-backdrop" id="exportModal">
        <div class="modal">
            <h2>Configuración JSON</h2>
            <pre id="exportCode"></pre>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">Cerrar</button>
                <button class="btn" onclick="copyExport()"><span class="material-symbols-outlined">content_copy</span> Copiar</button>
                <button class="btn btn-accent" onclick="downloadConfig()"><span class="material-symbols-outlined">download</span> Descargar</button>
            </div>
        </div>
    </div>

    <!-- ═══ FIREBASE SDK ═══ -->
    <script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyAfQZ4RARhe-jTD3emW4JVTmS_HMYBbZ2E",
    authDomain: "xrs-landing.firebaseapp.com",
    projectId: "xrs-landing",
    storageBucket: "xrs-landing.firebasestorage.app",
    messagingSenderId: "225138279563",
    appId: "1:225138279563:web:50dcbb04dc3eea32cf008e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const CONFIG_DOC = doc(db, 'config', 'hero');

// ── Expose Firebase functions globally ──
window._fb = { db, CONFIG_DOC, setDoc, getDoc, onSnapshot };

// ── Load from Firebase on init ──
async function loadFromFirebase() {
    try {
        const snap = await getDoc(CONFIG_DOC);
        if (snap.exists()) {
            const data = snap.data();
            if (data && data.scenes) {
                window.config = data;
                window.initUI();
                window.renderPreview();
                window.setSyncStatus('ok');
            }
        } else {
            // First time — push defaults to Firebase
            await setDoc(CONFIG_DOC, window.config);
            window.setSyncStatus('ok');
        }
    } catch(e) {
        console.error('Firebase load error:', e);
        window.setSyncStatus('error', e.message);
    }
}

// ── Real-time listener ──
onSnapshot(CONFIG_DOC, (snap) => {
    if (snap.exists()) {
        const data = snap.data();
        if (data && data.scenes && JSON.stringify(data) !== JSON.stringify(window.config)) {
            window.config = data;
            window.initUI();
            window.renderPreview();
            window.setSyncStatus('ok');
        }
    }
}, (err) => {
    console.error('Snapshot error:', err);
    window.setSyncStatus('error', err.message);
});

// Boot after DOM script below is ready
setTimeout(loadFromFirebase, 300);
</script>

    <!-- ═══ APP LOGIC ═══ -->
    <script>
const COLORS = ['#e7bf9c','#3de273','#3d9ee2','#e23d5e','#c97de2','#e2d13d','#5ee2c8','#e29a3d'];
const POSITIONS = {
    'bottom-left': 'Abajo izq',
    'bottom-right': 'Abajo der',
    'center-left': 'Centro izq',
    'center-right': 'Centro der',
    'center': 'Centro',
    'top-left': 'Arriba izq',
    'top-right': 'Arriba der',
};
const ANIMATIONS = {
    'fade-up': 'Fade + Slide Up',
    'fade-down': 'Fade + Slide Down',
    'fade-left': 'Fade + Slide Left',
    'fade-right': 'Fade + Slide Right',
    'fade': 'Solo Fade',
    'scale-up': 'Fade + Scale Up',
    'blur-in': 'Fade + Blur',
};
const MODULE_TYPES = {
    'tag': 'Tag',
    'headline': 'Headline',
    'body': 'Cuerpo',
    'cta': 'Botón CTA',
};

/* ── Default Config ── */
function getDefaultConfig() {
    return {
        scrollHeight: 5,
        frameCount: 168,
        fadeDuration: 0.04,
        translateY: 40,
        overlayOpacity: 0.75,
        scenes: [
            {
                id: 's1', name: 'Intro — Del plano', start: 0, end: 0.12,
                autoplay: false, autoplaySpeed: 1, holdOnEnd: false,
                modules: [

window.config = getDefaultConfig();
let activeScene = 0;
let currentProgress = 0;
let isPlaying = false;
let playInterval = null;

/* ── Sync Status ── */
window.setSyncStatus = function(status, msg) {
    const el = document.getElementById('syncStatus');
    if (status === 'ok') {
        el.className = 'sync-status';
        el.innerHTML = '<span class="material-symbols-outlined">cloud_done</span> Synced';
    } else if (status === 'saving') {
        el.className = 'sync-status';
        el.innerHTML = '<span class="material-symbols-outlined">cloud_sync</span> Saving...';
    } else {
        el.className = 'sync-status error';
        el.innerHTML = '<span class="material-symbols-outlined">cloud_off</span> Error';
        console.error(msg);
    }
};

/* ── Firebase Save ── */
window.saveToFirebase = async function() {
    if (!window._fb) return;
    setSyncStatus('saving');
    try {
        await window._fb.setDoc(window._fb.CONFIG_DOC, JSON.parse(JSON.stringify(config)));
        setSyncStatus('ok');
    } catch(e) {
        setSyncStatus('error', e.message);
    }
};

// Auto-save debounce
let saveTimer = null;
function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => window.saveToFirebase(), 1500);
}

function updateGlobal(key, val) {
    config[key] = val;
    renderPreview();
    autoSave();
}

/* ── Frames ── */
const frames = [];
let framesLoaded = 0, allFramesReady = false;
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

window.preloadFrames = function() {
    framesLoaded = 0; allFramesReady = false; frames.length = 0;
    for (let i = 1; i <= config.frameCount; i++) {
        const img = new Image();
        img.src = '../img/hero-frames/frame_' + String(i).padStart(4,'0') + '.jpg';
        img.onload = img.onerror = () => { framesLoaded++; if (framesLoaded === config.frameCount) { allFramesReady = true; renderPreview(); } };
        frames.push(img);
    }
};

function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; renderPreview(); }
window.addEventListener('resize', resizeCanvas);

/* ── Preview Render ── */
window.renderPreview = function() {
    if (!allFramesReady) return;
    const fi = Math.min(frames.length-1, Math.max(0, Math.floor(currentProgress * frames.length)));
    const img = frames[fi];
    if (img && img.complete && img.naturalWidth) {
        const cw=canvas.width, ch=canvas.height, iw=img.naturalWidth, ih=img.naturalHeight;
        const cr=cw/ch, ir=iw/ih;
        let dx=0,dy=0,dw=cw,dh=ch;
        if(ir>cr){dw=ch*ir;dx=(cw-dw)/2;}else{dh=cw/ir;dy=(ch-dh)/2;}
        ctx.clearRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh);
    }
    document.getElementById('frameInfo').textContent = `Frame ${fi+1} / ${frames.length} — ${Math.round(currentProgress*100)}%`;
    document.getElementById('progressFill').style.width = (currentProgress*100)+'%';
    document.getElementById('progressHandle').style.left = (currentProgress*100)+'%';
    const ph = document.querySelector('.timeline-playhead');
    if(ph) ph.style.left = (currentProgress*100)+'%';

    // Overlay
    const o = config.overlayOpacity;
    document.getElementById('previewOverlay').style.background =
        `linear-gradient(135deg, rgba(19,19,19,${o}) 0%, rgba(19,19,19,${o*0.53}) 40%, rgba(19,19,19,${o*0.2}) 100%)`;

    renderPreviewTexts();
};

function renderPreviewTexts() {
    const c = document.getElementById('previewTextContainer');
    c.innerHTML = '';
    config.scenes.forEach(scene => {
        if (!scene.modules) return;
        scene.modules.forEach(mod => {
            const fd = config.fadeDuration;
            const modStart = scene.start + (mod.delay || 0);
            const modEnd = scene.end;
            let opacity = 0, tx = 0, ty = 0, scale = 1, blur = 0;

            if (currentProgress >= modStart && currentProgress <= modEnd) {
                const inP = Math.min(1, (currentProgress - modStart) / fd);
                const outP = Math.min(1, (modEnd - currentProgress) / fd);
                opacity = Math.min(inP, outP);
                const ease = 1 - inP;
                const dist = config.translateY;
                switch(mod.animation) {
                    case 'fade-up': ty = dist * ease; break;
                    case 'fade-down': ty = -dist * ease; break;
                    case 'fade-left': tx = dist * ease; break;
                    case 'fade-right': tx = -dist * ease; break;
                    case 'scale-up': scale = 0.85 + 0.15 * inP; break;
                    case 'blur-in': blur = 12 * ease; break;
                    case 'fade': default: break;
                }
            }
            if (opacity <= 0) return;

            const div = document.createElement('div');
            div.className = 'preview-text-block';
            div.style.opacity = opacity;

            let transform = '';
            const pos = mod.position || 'bottom-left';
            const isCenterV = pos === 'center' || pos === 'center-left' || pos === 'center-right';

            if (pos === 'center') {
                div.style.top = '50%'; div.style.left = '50%';
                div.style.textAlign = 'center'; div.style.maxWidth = '700px';
                transform = `translate(-50%, calc(-50% + ${ty}px)) translateX(${tx}px) scale(${scale})`;
            } else if (pos === 'center-right') {
                div.style.top = '50%'; div.style.right = '32px'; div.style.left = 'auto';
                div.style.textAlign = 'right';
                transform = `translateY(calc(-50% + ${ty}px)) translateX(${tx}px) scale(${scale})`;
            } else if (pos === 'center-left') {
                div.style.top = '50%'; div.style.left = '0';
                transform = `translateY(calc(-50% + ${ty}px)) translateX(${tx}px) scale(${scale})`;
            } else if (pos.startsWith('bottom')) {
                div.style.bottom = '15%';
                if (pos.includes('right')) { div.style.right = '32px'; div.style.left = 'auto'; div.style.textAlign = 'right'; }
                else div.style.left = '0';
                transform = `translateY(${ty}px) translateX(${tx}px) scale(${scale})`;
            } else if (pos.startsWith('top')) {
                div.style.top = '15%';
                if (pos.includes('right')) { div.style.right = '32px'; div.style.left = 'auto'; div.style.textAlign = 'right'; }
                else div.style.left = '0';
                transform = `translateY(${ty}px) translateX(${tx}px) scale(${scale})`;
            }
            div.style.transform = transform;
            if (blur > 0) div.style.filter = `blur(${blur}px)`;

            const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
            if (mod.type === 'tag') div.innerHTML = `<span class="ptag">${esc(mod.content)}</span>`;
            else if (mod.type === 'headline') {
                const t = mod.size === 'h1' ? 'h1' : 'h2';
                div.innerHTML = `<${t}>${esc(mod.content)}</${t}>`;
            } else if (mod.type === 'body') div.innerHTML = `<p>${esc(mod.content)}</p>`;
            else if (mod.type === 'cta') div.innerHTML = `<span class="pbtn">${esc(mod.content)}</span>`;

            c.appendChild(div);
        });
    });
}

    config.scenes.forEach((scene, si) => {

        let modulesHtml = '';

            modulesHtml += `
            <div class="module-item ${si===activeScene && mi===0 ? 'open' : ''}" data-si="${si}" data-mi="${mi}">
                <div class="module-header" onclick="toggleModule(this)">
                    <span class="module-type-badge">${MODULE_TYPES[mod.type]||mod.type}</span>
                    <span class="module-name">${escH(mod.content).substring(0,30)}${mod.content.length>30?'...':''}</span>
                    <div class="module-actions">
                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();moveModule(${si},${mi},-1)" title="Subir">
                            <span class="material-symbols-outlined" style="font-size:14px">arrow_upward</span>
                        </button>
                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();moveModule(${si},${mi},1)" title="Bajar">
                            <span class="material-symbols-outlined" style="font-size:14px">arrow_downward</span>
                        </button>
                        <button class="btn btn-ghost btn-sm btn-danger" onclick="event.stopPropagation();deleteModule(${si},${mi})" title="Eliminar">
                            <span class="material-symbols-outlined" style="font-size:14px">close</span>
                        </button>
                    </div>
                </div>
                <div class="module-body">
                    <div class="field-group">
                        <label class="field-label">Tipo</label>
                        <select class="field-select" onchange="updateMod(${si},${mi},'type',this.value)">
                            ${Object.entries(MODULE_TYPES).map(([k,v])=>`<option value="${k}" ${mod.type===k?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Contenido</label>
                        <textarea class="field-input" rows="2" onchange="updateMod(${si},${mi},'content',this.value)">${escH(mod.content)}</textarea>
                    </div>
                    ${mod.type==='cta'?`<div class="field-group"><label class="field-label">Link href</label><input class="field-input" value="${escA(mod.href||'#')}" onchange="updateMod(${si},${mi},'href',this.value)"/></div>`:''}
                    ${mod.type==='headline'?`<div class="field-group"><label class="field-label">Tamaño</label><select class="field-select" onchange="updateMod(${si},${mi},'size',this.value)"><option value="h1" ${mod.size==='h1'?'selected':''}>H1 Grande</option><option value="h2" ${mod.size==='h2'?'selected':''}>H2 Medio</option></select></div>`:''}
                    <div class="field-group">
                        <label class="field-label">Posición</label>
                        <select class="field-select" onchange="updateMod(${si},${mi},'position',this.value)">
                            ${Object.entries(POSITIONS).map(([k,v])=>`<option value="${k}" ${mod.position===k?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Animación de entrada</label>
                        <select class="field-select" onchange="updateMod(${si},${mi},'animation',this.value)">
                            ${Object.entries(ANIMATIONS).map(([k,v])=>`<option value="${k}" ${mod.animation===k?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Delay de entrada <small>Offset sobre el start de la escena (0-1)</small></label>
                        <input type="number" class="field-input field-input-sm" value="${mod.delay||0}" min="0" max="0.5" step="0.005"
                            onchange="updateMod(${si},${mi},'delay',parseFloat(this.value))" />
                    </div>
                </div>
            </div>`;
        });

        li.innerHTML = `
            <div class="scene-header" onclick="toggleScene(${si})">
                <span class="scene-color" style="background:${color}"></span>
                <span class="scene-name">${escH(scene.name)}</span>
                <span class="scene-range">${r(scene.start)}% — ${r(scene.end)}%</span>
                <span class="material-symbols-outlined scene-toggle">expand_more</span>
            </div>
            <div class="scene-body">
                <div class="field-group">
                    <label class="field-label">Nombre</label>
                    <input class="field-input" value="${escA(scene.name)}" onchange="updateScn(${si},'name',this.value)" />
                </div>
                <div class="field-group">
                    <label class="field-label">Rango de scroll</label>
                    <div class="range-bar"><div class="range-bar-fill" style="left:${scene.start*100}%;width:${(scene.end-scene.start)*100}%;background:${color}"></div></div>
                    <div class="field-row">
                        <input type="number" class="field-input field-input-sm" value="${scene.start}" min="0" max="1" step="0.01" onchange="updateScn(${si},'start',parseFloat(this.value))" />
                        <span style="color:var(--text-dim)">—</span>
                        <input type="number" class="field-input field-input-sm" value="${scene.end}" min="0" max="1" step="0.01" onchange="updateScn(${si},'end',parseFloat(this.value))" />
                        <button class="btn btn-sm" onclick="previewScene(${si})"><span class="material-symbols-outlined">visibility</span></button>
                    </div>
                </div>

                <div class="field-group" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
                    <label class="field-label">Autoplay</label>
                    <div class="config-row" style="margin-top:6px;">
                        <span style="font-size:0.82rem">Activar</span>
                        <div class="toggle ${scene.autoplay?'on':''}" onclick="updateScn(${si},'autoplay',!config.scenes[${si}].autoplay)"></div>
                    </div>
                    <div style="opacity:${scene.autoplay?1:0.35};pointer-events:${scene.autoplay?'auto':'none'}">
                        <div class="config-row" style="margin-top:6px;">
                            <span style="font-size:0.82rem">Velocidad</span>
                            <input type="number" class="config-input" value="${scene.autoplaySpeed}" min="0.1" max="5" step="0.1" onchange="updateScn(${si},'autoplaySpeed',parseFloat(this.value))"/>
                        </div>
                        <div class="config-row">
                            <span style="font-size:0.82rem">Pausar al final</span>
                            <div class="toggle ${scene.holdOnEnd?'on':''}" onclick="updateScn(${si},'holdOnEnd',!config.scenes[${si}].holdOnEnd)"></div>
                        </div>
                    </div>
                </div>

                <div class="field-group" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
                    <label class="field-label">Módulos de texto</label>
                    <div class="module-list">${modulesHtml}</div>
                    <button class="add-module-btn" onclick="addModule(${si})">
                        <span class="material-symbols-outlined" style="font-size:16px">add</span> Agregar módulo
                    </button>
                </div>

                <div style="margin-top:12px;display:flex;justify-content:flex-end;">

function escH(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function r(n){return Math.round(n*100);}

function toggleScene(i) {
    activeScene = i;
    document.querySelectorAll('.scene-item').forEach((el,j)=>{el.classList.toggle('active',j===i);el.classList.toggle('open',j===i);});
    renderTimeline();
}

function toggleModule(header) {
    header.closest('.module-item').classList.toggle('open');
}

function updateScn(i,k,v) { config.scenes[i][k]=v; renderSceneList(); renderPreview(); autoSave(); }
function updateMod(si,mi,k,v) { config.scenes[si].modules[mi][k]=v; renderSceneList(); renderPreview(); autoSave(); }

function addModule(si) {
    config.scenes[si].modules.push({
        id: 'm'+Date.now(), type: 'body', content: 'Nuevo texto',
        position: config.scenes[si].modules[0]?.position || 'bottom-left',
        animation: 'fade-up', delay: (config.scenes[si].modules.length * 0.01), size: 'md',
    });
    renderSceneList(); autoSave();
}
function deleteModule(si,mi) { config.scenes[si].modules.splice(mi,1); renderSceneList(); renderPreview(); autoSave(); }
function moveModule(si,mi,dir) {
    const mods = config.scenes[si].modules;
    const ni = mi+dir;
    if(ni<0||ni>=mods.length) return;
    [mods[mi], mods[ni]] = [mods[ni], mods[mi]];
    renderSceneList(); autoSave();
}

function previewScene(i) { stopPlay(); activeScene=i; currentProgress=config.scenes[i].start+(config.scenes[i].end-config.scenes[i].start)*0.35; renderPreview(); renderSceneList(); }
function deleteScene(i) { if(config.scenes.length<=1) return; config.scenes.splice(i,1); if(activeScene>=config.scenes.length) activeScene--; renderSceneList(); renderPreview(); autoSave(); }
function addScene() {
    const last = config.scenes[config.scenes.length-1];
    const s = last ? Math.min(last.end+0.03, 0.95) : 0;
    const e = Math.min(s+0.15, 1);
    config.scenes.push({
        id:'s'+Date.now(), name:'Nueva escena', start:+s.toFixed(2), end:+e.toFixed(2),
        autoplay:false, autoplaySpeed:1, holdOnEnd:false,
        modules:[{id:'m'+Date.now(), type:'headline', content:'Título', position:'center-left', animation:'fade-up', delay:0, size:'h2'}]
    });
    activeScene = config.scenes.length-1;
    renderSceneList(); autoSave();
}

/* ── Timeline ── */
function renderTimeline() {
    const t = document.getElementById('timelineTrack');
    t.innerHTML = '<div class="timeline-playhead" style="left:'+(currentProgress*100)+'%"></div>';
    config.scenes.forEach((s,i) => {
        const d = document.createElement('div');
        d.className = 'timeline-scene'+(i===activeScene?' active':'');
        d.style.left=(s.start*100)+'%'; d.style.width=((s.end-s.start)*100)+'%';
        d.style.background = COLORS[i%COLORS.length];
        d.textContent = i+1;
        d.onclick = ()=>previewScene(i);
        t.appendChild(d);
    });
}

/* ── Playback ── */
function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent = isPlaying?'pause':'play_arrow';
    if(isPlaying){ if(currentProgress>=0.99) currentProgress=0; playInterval=setInterval(()=>{currentProgress+=0.002;if(currentProgress>=1){currentProgress=1;togglePlay();}renderPreview();},16); }
    else clearInterval(playInterval);
}
function stopPlay() { if(isPlaying){isPlaying=false;clearInterval(playInterval);document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent='play_arrow';} }
function stepBack() { stopPlay(); currentProgress=Math.max(0,currentProgress-(1/config.frameCount)); renderPreview(); }
function stepForward() { stopPlay(); currentProgress=Math.min(1,currentProgress+(1/config.frameCount)); renderPreview(); }
function jumpTo(p) { stopPlay(); currentProgress=p; renderPreview(); }

/* ── Progress drag ── */
const pt = document.getElementById('progressTrack');
let dragging = false;
function handleDrag(e){ const r=pt.getBoundingClientRect(); const x=e.touches?e.touches[0].clientX:e.clientX; currentProgress=Math.max(0,Math.min(1,(x-r.left)/r.width)); renderPreview(); }
pt.addEventListener('mousedown',e=>{dragging=true;stopPlay();handleDrag(e);});
window.addEventListener('mousemove',e=>{if(dragging)handleDrag(e);});
window.addEventListener('mouseup',()=>{dragging=false;});
pt.addEventListener('touchstart',e=>{dragging=true;stopPlay();handleDrag(e);},{passive:true});
window.addEventListener('touchmove',e=>{if(dragging)handleDrag(e);},{passive:true});
window.addEventListener('touchend',()=>{dragging=false;});

/* ── Export ── */
function showExportModal() { document.getElementById('exportCode').textContent=JSON.stringify(config,null,2); document.getElementById('exportModal').classList.add('show'); }
function closeModal() { document.getElementById('exportModal').classList.remove('show'); }
function copyExport() { navigator.clipboard.writeText(JSON.stringify(config,null,2)); }
function downloadConfig() { const b=new Blob([JSON.stringify(config,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='hero-config.json'; a.click(); }
function resetConfig() { if(!confirm('Resetear?')) return; config=getDefaultConfig(); initUI(); renderPreview(); autoSave(); }

/* ── Init ── */
window.initUI = function() {
    document.getElementById('cfgScrollHeight').value = config.scrollHeight;
    document.getElementById('cfgFrameCount').value = config.frameCount;
    document.getElementById('cfgFadeDuration').value = config.fadeDuration;
    document.getElementById('cfgTranslateY').value = config.translateY;
    document.getElementById('cfgOverlayOpacity').value = config.overlayOpacity;
    renderSceneList();
};

document.addEventListener('keydown', e => {
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    if(e.key===' '){e.preventDefault();togglePlay();}
    if(e.key==='ArrowLeft'){e.preventDefault();stepBack();}
    if(e.key==='ArrowRight'){e.preventDefault();stepForward();}
    if(e.key==='Escape') closeModal();
});

initUI();
resizeCanvas();
preloadFrames();
    </script>

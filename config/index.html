<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>XRS Hero — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a0a;--surface:#151515;--surface-2:#1e1e1e;--surface-3:#282828;--surface-4:#333;
--border:#2a2a2a;--border-2:#3a3a3a;--text:#e0e0e0;--text-dim:#777;--text-muted:#555;
--accent:#e7bf9c;--accent-dim:rgba(231,191,156,.12);--green:#3de273;--red:#e23d5e;--blue:#4aa8e8;--purple:#a87de2;
--font:'Inter',sans-serif;
}
html{font-size:13px}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;font-size:18px;vertical-align:middle}

/* ═══ TOOLBAR ═══ */
.toolbar{display:flex;align-items:center;height:40px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;gap:8px;flex-shrink:0}
.toolbar-brand{font-weight:700;font-size:.9rem;margin-right:12px;color:var(--accent)}
.toolbar-sep{width:1px;height:20px;background:var(--border-2);margin:0 4px}
.tb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:4px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font);font-size:.75rem;font-weight:500;cursor:pointer;transition:all 120ms}
.tb:hover{background:var(--surface-3);color:var(--text)}
.tb.active,.tb-accent{background:var(--accent);color:#1a1a1a}
.tb .material-symbols-outlined{font-size:16px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:2px}
.sync-dot.err{background:var(--red)}
.toolbar-spacer{flex:1}
.tb-timecode{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--accent);font-weight:600;padding:0 8px;min-width:100px;text-align:center}

/* ═══ MAIN LAYOUT ═══ */
.main{flex:1;display:flex;overflow:hidden}

/* ═══ PREVIEW ═══ */
.preview-panel{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
.preview-wrap{flex:1;position:relative;overflow:hidden}
#previewCanvas{width:100%;height:100%;display:block}
.preview-overlay{position:absolute;inset:0;pointer-events:none;z-index:1}
#previewTextLayer{position:absolute;inset:0;z-index:10;pointer-events:none}

/* Preview text elements */
.pv-mod{position:absolute;pointer-events:none;transition:none;white-space:pre-line}
.pv-mod.selected{outline:1px solid var(--accent);outline-offset:4px;pointer-events:auto;cursor:move}

/* ═══ PROPERTIES PANEL ═══ */
.props-panel{width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.props-header{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:.8rem;display:flex;align-items:center;gap:8px}
.props-header .material-symbols-outlined{font-size:16px;color:var(--accent)}
.props-body{flex:1;overflow-y:auto;padding:0}
.props-empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:.82rem;line-height:1.6}
.prop-section{border-bottom:1px solid var(--border);padding:12px 14px}
.prop-section-title{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:10px}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prop-row:last-child{margin-bottom:0}
.prop-label{font-size:.78rem;width:70px;flex-shrink:0;color:var(--text-dim)}
.prop-input{flex:1;padding:5px 8px;border-radius:4px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:.8rem}
.prop-input:focus{outline:none;border-color:var(--accent)}
textarea.prop-input{resize:vertical;min-height:50px;line-height:1.4}
.prop-input-sm{width:56px;flex:none;text-align:center}
.prop-select{flex:1;padding:5px 8px;border-radius:4px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:.8rem;cursor:pointer}
.prop-select:focus{outline:none;border-color:var(--accent)}
.prop-color{width:28px;height:28px;border-radius:4px;border:1px solid var(--border-2);cursor:pointer;padding:0;background:none}
.prop-color::-webkit-color-swatch-wrapper{padding:2px}
.prop-color::-webkit-color-swatch{border:none;border-radius:2px}
.prop-range{flex:1;accent-color:var(--accent)}
.prop-range-val{width:36px;text-align:right;font-size:.75rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

/* ═══ TIMELINE ═══ */
.timeline-panel{height:240px;min-height:180px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}

/* Timeline toolbar */
.tl-toolbar{display:flex;align-items:center;height:32px;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.tl-toolbar .tb{padding:3px 6px;font-size:.7rem}

/* Timeline body */
.tl-body{flex:1;display:flex;overflow:hidden}

/* Track labels */
.tl-labels{width:120px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.tl-label{height:36px;display:flex;align-items:center;padding:0 10px;gap:6px;border-bottom:1px solid var(--border);font-size:.72rem;font-weight:600}
.tl-label-badge{width:22px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#000}
.tl-label-name{flex:1;color:var(--text-dim)}
.tl-label .tb{padding:2px 4px}

/* Timeline tracks area */
.tl-tracks-wrap{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.tl-tracks{position:relative;min-width:100%}

/* Ruler */
.tl-ruler{height:24px;position:relative;border-bottom:1px solid var(--border);background:var(--surface-2);cursor:pointer;flex-shrink:0}
.tl-ruler-tick{position:absolute;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px}
.tl-ruler-tick span{font-size:.55rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tl-ruler-tick::before{content:'';position:absolute;top:0;width:1px;height:6px;background:var(--border-2)}

/* Track rows */
.tl-track{height:36px;position:relative;border-bottom:1px solid var(--border)}
.tl-track:nth-child(even){background:rgba(255,255,255,.01)}

/* Clips */
.tl-clip{position:absolute;top:3px;bottom:3px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 8px;font-size:.65rem;font-weight:600;color:rgba(0,0,0,.75);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:box-shadow 120ms}
.tl-clip:hover{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.tl-clip.selected{box-shadow:0 0 0 2px var(--accent),0 0 12px rgba(231,191,156,.3)}
.tl-clip-handle{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.tl-clip-handle.left{left:0;border-radius:4px 0 0 4px}
.tl-clip-handle.right{right:0;border-radius:0 4px 4px 0}
.tl-clip-handle:hover{background:rgba(255,255,255,.2)}

/* Video track with thumbnails */
.tl-track-video{height:48px}
.tl-thumb-strip{position:absolute;top:2px;bottom:2px;display:flex;overflow:hidden;border-radius:3px;opacity:.5}
.tl-thumb-strip img{height:100%;width:auto;flex-shrink:0}

/* Playhead */
.tl-playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:20;pointer-events:none}
.tl-playhead::before{content:'';position:absolute;top:-2px;left:-5px;width:12px;height:8px;background:var(--accent);clip-path:polygon(0 0,100% 0,50% 100%)}

/* Resize handle for timeline height */
.tl-resize{height:4px;cursor:ns-resize;background:transparent;flex-shrink:0}
.tl-resize:hover{background:var(--accent-dim)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
</style>
</head>
<body>

<!-- ═══ TOOLBAR ═══ -->
<div class="toolbar">
    <span class="toolbar-brand">XRS Editor</span>
    <div class="toolbar-sep"></div>
    <button class="tb" onclick="saveToFirebase()" title="Guardar"><span class="material-symbols-outlined">cloud_upload</span> Guardar</button>
    <div class="sync-dot" id="syncDot"></div>
    <div class="toolbar-sep"></div>
    <button class="tb" onclick="jumpTo(0)"><span class="material-symbols-outlined">skip_previous</span></button>
    <button class="tb" onclick="stepBack()"><span class="material-symbols-outlined">navigate_before</span></button>
    <button class="tb" id="btnPlay" onclick="togglePlay()"><span class="material-symbols-outlined">play_arrow</span></button>
    <button class="tb" onclick="stepForward()"><span class="material-symbols-outlined">navigate_next</span></button>
    <button class="tb" onclick="jumpTo(1)"><span class="material-symbols-outlined">skip_next</span></button>
    <span class="tb-timecode" id="timecode">00:00 / F001</span>
    <div class="toolbar-spacer"></div>
    <button class="tb" onclick="addTrack()"><span class="material-symbols-outlined">add</span> Track</button>
    <button class="tb" onclick="showJSON()"><span class="material-symbols-outlined">data_object</span></button>
    <button class="tb" onclick="resetConfig()"><span class="material-symbols-outlined">restart_alt</span></button>
    <div class="toolbar-sep"></div>
    <label class="tb" title="Scroll Height (vh)">
        <span class="material-symbols-outlined">height</span>
        <input type="number" id="cfgHeight" value="5" min="2" max="15" step=".5" style="width:40px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:3px;padding:2px 4px;font-size:.75rem;text-align:center" onchange="config.scrollHeight=parseFloat(this.value);autoSave()">
        vh
    </label>
    <label class="tb" title="Overlay Opacity">
        <span class="material-symbols-outlined">gradient</span>
        <input type="number" id="cfgOverlay" value=".75" min="0" max="1" step=".05" style="width:44px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:3px;padding:2px 4px;font-size:.75rem;text-align:center" onchange="config.overlayOpacity=parseFloat(this.value);autoSave();renderPreview()">
    </label>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
    <!-- Preview -->
    <div class="preview-panel">
        <div class="preview-wrap" id="previewWrap">
            <canvas id="previewCanvas"></canvas>
            <div class="preview-overlay" id="previewOverlay"></div>
            <div id="previewTextLayer"></div>
        </div>
    </div>

    <!-- Properties -->
    <div class="props-panel">
        <div class="props-header"><span class="material-symbols-outlined">tune</span> Propiedades</div>
        <div class="props-body" id="propsBody">
            <div class="props-empty">Seleccioná un clip en el timeline para editar sus propiedades.</div>
        </div>
    </div>
</div>

<!-- ═══ TIMELINE ═══ -->
<div class="tl-resize" id="tlResize"></div>
<div class="timeline-panel" id="timelinePanel">
    <div class="tl-toolbar">
        <button class="tb" onclick="zoomIn()"><span class="material-symbols-outlined">zoom_in</span></button>
        <button class="tb" onclick="zoomOut()"><span class="material-symbols-outlined">zoom_out</span></button>
        <button class="tb" onclick="zoomFit()"><span class="material-symbols-outlined">fit_screen</span></button>
        <div class="toolbar-spacer"></div>
        <button class="tb" onclick="addClipToSelected()" title="Agregar clip al track seleccionado"><span class="material-symbols-outlined">add_box</span> Clip</button>
        <button class="tb" onclick="duplicateClip()" title="Duplicar clip seleccionado"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="tb" onclick="deleteClip()" title="Eliminar clip (Del)"><span class="material-symbols-outlined">delete</span></button>
    </div>
    <div class="tl-body">
        <div class="tl-labels" id="tlLabels"></div>
        <div class="tl-tracks-wrap" id="tlTracksWrap">
            <div class="tl-ruler" id="tlRuler"></div>
            <div class="tl-tracks" id="tlTracks"></div>
        </div>
    </div>
</div>

<!-- JSON Modal -->
<div id="jsonModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center">
    <div style="background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:20px;width:90%;max-width:700px;max-height:80vh;overflow-y:auto">
        <h3 style="margin-bottom:12px;font-size:.95rem">Config JSON</h3>
        <pre id="jsonCode" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;font-size:.72rem;overflow-x:auto;white-space:pre-wrap;max-height:50vh;line-height:1.5"></pre>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
            <button class="tb" onclick="document.getElementById('jsonModal').style.display='none'">Cerrar</button>
            <button class="tb" onclick="navigator.clipboard.writeText(JSON.stringify(config,null,2))"><span class="material-symbols-outlined">content_copy</span> Copiar</button>
        </div>
    </div>
</div>

<!-- ═══ FIREBASE ═══ -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyAfQZ4RARhe-jTD3emW4JVTmS_HMYBbZ2E",authDomain:"xrs-landing.firebaseapp.com",projectId:"xrs-landing",storageBucket:"xrs-landing.firebasestorage.app",messagingSenderId:"225138279563",appId:"1:225138279563:web:50dcbb04dc3eea32cf008e"});
const db=getFirestore(app);const D=doc(db,'config','hero');
window._fb={db,D,setDoc,getDoc,onSnapshot};
async function load(){try{const s=await getDoc(D);if(s.exists()&&s.data().tracks){window.config=s.data();window.syncOK=true;window.boot();}else{await setDoc(D,JSON.parse(JSON.stringify(window.config)));window.syncOK=true;window.boot();}}catch(e){console.warn('FB load:',e);window.syncOK=false;window.boot();}}
onSnapshot(D,s=>{if(s.exists()&&s.data().tracks){const d=s.data();if(JSON.stringify(d)!==JSON.stringify(window.config)){window.config=d;window.syncOK=true;window.fullRender();}}},e=>{window.syncOK=false;updSync();});
setTimeout(load,200);
</script>

<!-- ═══ ENGINE ═══ -->
<script>
/* ── COLORS ── */
const CL=['#e7bf9c','#3de273','#4aa8e8','#e23d5e','#a87de2','#e2d13d','#5ee2c8','#e29a3d','#e26baf','#6be2a8'];

/* ── DEFAULT CONFIG (new track-based model) ── */
function getDefault(){return{
scrollHeight:5,frameCount:168,overlayOpacity:.75,fadeDuration:.04,
tracks:[
{id:'t1',name:'Video',type:'video',visible:true,locked:false,clips:[]},
{id:'t2',name:'T1',type:'text',visible:true,locked:false,color:CL[0],clips:[
{id:'c1',start:0,end:.12,modules:[
{type:'tag',content:'Comercialización estratégica para real estate',x:5,y:82,fontSize:12,fontFamily:'Inter',fontWeight:600,color:'#e7bf9c',letterSpacing:3,lineHeight:1.4,opacity:1,textAlign:'left',animation:'fade-up',delay:0},
{type:'headline',content:'Del plano\na la estrategia.',x:5,y:68,fontSize:60,fontFamily:'Manrope',fontWeight:800,color:'#e2e2e2',letterSpacing:-1,lineHeight:1.05,opacity:1,textAlign:'left',animation:'fade-up',delay:.01},
]},
{id:'c2',start:.15,end:.30,modules:[
{type:'headline',content:'Transformamos la visión\ndel desarrollador en un activo\ncomercial de alto impacto.',x:5,y:42,fontSize:48,fontFamily:'Manrope',fontWeight:800,color:'#e2e2e2',letterSpacing:-1,lineHeight:1.08,opacity:1,textAlign:'left',animation:'fade-up',delay:0},
]},
]},
{id:'t3',name:'T2',type:'text',visible:true,locked:false,color:CL[2],clips:[
{id:'c3',start:.33,end:.50,modules:[
{type:'tag',content:'Precisión en cada capa',x:5,y:82,fontSize:11,fontFamily:'Inter',fontWeight:600,color:'#e7bf9c',letterSpacing:3,lineHeight:1.4,opacity:1,textAlign:'left',animation:'fade-up',delay:0},
{type:'headline',content:'Cada metro cuadrado\ntiene una historia que contar.',x:5,y:65,fontSize:48,fontFamily:'Manrope',fontWeight:800,color:'#e2e2e2',letterSpacing:-1,lineHeight:1.08,opacity:1,textAlign:'left',animation:'fade-up',delay:.01},
{type:'body',content:'Diseñamos el ecosistema que la hace irresistible.',x:5,y:58,fontSize:16,fontFamily:'Inter',fontWeight:300,color:'#d3c4b9',letterSpacing:0,lineHeight:1.7,opacity:.9,textAlign:'left',animation:'fade-up',delay:.02},
]},
{id:'c4',start:.55,end:.72,modules:[
{type:'tag',content:'Experiencia inmersiva',x:60,y:42,fontSize:11,fontFamily:'Inter',fontWeight:600,color:'#e7bf9c',letterSpacing:3,lineHeight:1.4,opacity:1,textAlign:'right',animation:'fade-left',delay:0},
{type:'headline',content:'No mostramos renders.\nCreamos vivencias.',x:60,y:50,fontSize:48,fontFamily:'Manrope',fontWeight:800,color:'#e2e2e2',letterSpacing:-1,lineHeight:1.08,opacity:1,textAlign:'right',animation:'fade-left',delay:.01},
{type:'body',content:'Tecnología y narrativa al servicio\nde la decisión de compra.',x:60,y:62,fontSize:16,fontFamily:'Inter',fontWeight:300,color:'#d3c4b9',letterSpacing:0,lineHeight:1.7,opacity:.9,textAlign:'right',animation:'fade-left',delay:.02},
]},
]},
{id:'t4',name:'CTA',type:'text',visible:true,locked:false,color:CL[3],clips:[
{id:'c5',start:.78,end:1,modules:[
{type:'headline',content:'Potenciamos cómo un proyecto\nse presenta, se entiende\ny se vende.',x:50,y:42,fontSize:56,fontFamily:'Manrope',fontWeight:800,color:'#e2e2e2',letterSpacing:-1,lineHeight:1.05,opacity:1,textAlign:'center',animation:'fade-up',delay:0},
{type:'cta',content:'Hacer autodiagnóstico',x:50,y:62,fontSize:12,fontFamily:'Manrope',fontWeight:700,color:'#432b12',letterSpacing:2,lineHeight:1,opacity:1,textAlign:'center',animation:'fade-up',delay:.02,bgColor:'#e7bf9c',href:'#diagnostico'},
]},
]},
],
}}
window.config=getDefault();
let sel={track:-1,clip:-1,mod:-1}; // selected
let progress=0,playing=false,playInt=null;
let zoom=1,scrollX=0;
let selTrack=1; // default selected track index

/* ── FRAMES ── */
const frames=[],thumbs=[];let framesOK=false;
function loadFrames(){
    let n=0;frames.length=0;
    for(let i=1;i<=config.frameCount;i++){
        const img=new Image();
        img.src='../img/hero-frames/frame_'+String(i).padStart(4,'0')+'.jpg';
        img.onload=img.onerror=()=>{n++;if(n>=config.frameCount){framesOK=true;renderPreview();buildThumbs();}};
        frames.push(img);
    }
}
function buildThumbs(){
    thumbs.length=0;
    // Sample ~20 thumbnails
    const step=Math.max(1,Math.floor(frames.length/20));
    for(let i=0;i<frames.length;i+=step){
        if(frames[i]&&frames[i].complete&&frames[i].naturalWidth)thumbs.push(frames[i]);
    }
    renderTimeline();
}

/* ── CANVAS ── */
const canvas=document.getElementById('previewCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;renderPreview();}
window.addEventListener('resize',()=>{resizeCanvas();renderTimeline();});

/* ── RENDER PREVIEW ── */
window.renderPreview=function(){
if(!framesOK)return;
const fi=Math.min(frames.length-1,Math.max(0,Math.floor(progress*frames.length)));
const img=frames[fi];
if(img&&img.complete&&img.naturalWidth){
    const cw=canvas.width,ch=canvas.height,iw=img.naturalWidth,ih=img.naturalHeight;
    const cr=cw/ch,ir=iw/ih;
    let dx=0,dy=0,dw=cw,dh=ch;
    if(ir>cr){dw=ch*ir;dx=(cw-dw)/2;}else{dh=cw/ir;dy=(ch-dh)/2;}
    ctx.clearRect(0,0,cw,ch);ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh);
}
// Overlay
const o=config.overlayOpacity;
document.getElementById('previewOverlay').style.background=
    `linear-gradient(135deg,rgba(19,19,19,${o}) 0%,rgba(19,19,19,${o*.53}) 40%,rgba(19,19,19,${o*.2}) 100%)`;
// Timecode
const sec=(progress*21).toFixed(1);
document.getElementById('timecode').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}.${(sec%1*10).toFixed(0)} / F${String(fi+1).padStart(3,'0')}`;
// Text
renderTextLayer();
// Playhead
updatePlayhead();
};

function renderTextLayer(){
const layer=document.getElementById('previewTextLayer');
layer.innerHTML='';
const fd=config.fadeDuration||.04;
config.tracks.forEach((track,ti)=>{
    if(track.type!=='text'||!track.visible)return;
    track.clips.forEach((clip,ci)=>{
        if(!clip.modules)return;
        clip.modules.forEach((m,mi)=>{
            const mStart=clip.start+(m.delay||0);
            const mEnd=clip.end;
            let op=0,tx=0,ty=0,sc=1,bl=0;
            if(progress>=mStart&&progress<=mEnd){
                const inP=Math.min(1,(progress-mStart)/fd);
                const outP=Math.min(1,(mEnd-progress)/fd);
                op=Math.min(inP,outP)*(m.opacity!=null?m.opacity:1);
                const ease=1-inP,dist=40;
                switch(m.animation){
                    case'fade-up':ty=dist*ease;break;case'fade-down':ty=-dist*ease;break;
                    case'fade-left':tx=dist*ease;break;case'fade-right':tx=-dist*ease;break;
                    case'scale-up':sc=.85+.15*inP;break;case'blur-in':bl=12*ease;break;
                }
            }
            if(op<=0)return;
            const d=document.createElement('div');
            d.className='pv-mod'+(sel.track===ti&&sel.clip===ci&&sel.mod===mi?' selected':'');
            d.style.left=m.x+'%';d.style.top=m.y+'%';
            d.style.opacity=op;
            d.style.transform=`translate(${m.textAlign==='center'?'-50%':'0'},0) translateX(${tx}px) translateY(${ty}px) scale(${sc})`;
            if(bl>0)d.style.filter=`blur(${bl}px)`;
            d.style.fontFamily=m.fontFamily||'Inter';
            d.style.fontSize=(m.fontSize||16)*(canvas.clientWidth/1280)+'px';
            d.style.fontWeight=m.fontWeight||400;
            d.style.color=m.color||'#e2e2e2';
            d.style.letterSpacing=(m.letterSpacing||0)+'px';
            d.style.lineHeight=m.lineHeight||1.4;
            d.style.textAlign=m.textAlign||'left';
            if(m.textAlign==='right'){d.style.left='auto';d.style.right=(100-m.x)+'%';}
            if(m.textAlign==='uppercase'||m.type==='tag'||m.type==='cta')d.style.textTransform='uppercase';

            if(m.type==='cta'&&m.bgColor){
                d.style.background=m.bgColor;d.style.display='inline-block';
                d.style.padding='.8em 2.2em';d.style.borderRadius='2px';
                d.style.textTransform='uppercase';
            }

            d.textContent=m.content||'';
            d.onmousedown=(e)=>{e.stopPropagation();selectMod(ti,ci,mi);};
            layer.appendChild(d);
        });
    });
});
}

/* ── SELECTION ── */
function selectMod(ti,ci,mi){sel={track:ti,clip:ci,mod:mi};renderProps();renderPreview();renderTimeline();}
function selectClip(ti,ci){sel={track:ti,clip:ci,mod:ci>=0&&config.tracks[ti].clips[ci]?.modules?.length?0:-1};selTrack=ti;renderProps();renderPreview();renderTimeline();}
function clearSel(){sel={track:-1,clip:-1,mod:-1};renderProps();renderPreview();renderTimeline();}

/* ── PROPERTIES PANEL ── */
function renderProps(){
const body=document.getElementById('propsBody');
if(sel.track<0||sel.clip<0){body.innerHTML='<div class="props-empty">Seleccioná un clip en el timeline.</div>';return;}
const track=config.tracks[sel.track];
const clip=track.clips[sel.clip];
if(!clip){body.innerHTML='<div class="props-empty">Clip no encontrado.</div>';return;}

let html=`<div class="prop-section"><div class="prop-section-title">Clip</div>
<div class="prop-row"><span class="prop-label">Inicio</span><input class="prop-input prop-input-sm" type="number" value="${clip.start}" min="0" max="1" step=".01" onchange="updClip('start',parseFloat(this.value))"></div>
<div class="prop-row"><span class="prop-label">Fin</span><input class="prop-input prop-input-sm" type="number" value="${clip.end}" min="0" max="1" step=".01" onchange="updClip('end',parseFloat(this.value))"></div>
<div class="prop-row"><span class="prop-label">Fade</span><input class="prop-input prop-input-sm" type="number" value="${config.fadeDuration}" min=".005" max=".2" step=".005" onchange="config.fadeDuration=parseFloat(this.value);autoSave();renderPreview()"></div>
</div>`;

// Module tabs
if(clip.modules&&clip.modules.length){
html+=`<div class="prop-section"><div class="prop-section-title" style="display:flex;align-items:center;justify-content:space-between">Módulos <button class="tb" style="font-size:.6rem;padding:2px 6px" onclick="addModToClip()"><span class="material-symbols-outlined" style="font-size:14px">add</span></button></div>`;
html+=`<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">`;
clip.modules.forEach((_,mi)=>{
    html+=`<button class="tb${sel.mod===mi?' active':''}" style="font-size:.65rem;padding:3px 8px" onclick="sel.mod=${mi};renderProps();renderPreview()">${mi+1}. ${clip.modules[mi].type}</button>`;
});
html+=`</div>`;

if(sel.mod>=0&&sel.mod<clip.modules.length){
const m=clip.modules[sel.mod];
html+=`
<div class="prop-row"><span class="prop-label">Tipo</span><select class="prop-select" onchange="updMod('type',this.value)">
<option value="tag"${m.type==='tag'?' selected':''}>Tag</option>
<option value="headline"${m.type==='headline'?' selected':''}>Headline</option>
<option value="body"${m.type==='body'?' selected':''}>Body</option>
<option value="cta"${m.type==='cta'?' selected':''}>CTA</option>
</select></div>
<div class="prop-row" style="align-items:flex-start"><span class="prop-label" style="margin-top:6px">Texto</span><textarea class="prop-input" onchange="updMod('content',this.value)">${esc(m.content)}</textarea></div>

<div class="prop-section-title" style="margin-top:10px">Posición</div>
<div class="prop-row"><span class="prop-label">X %</span><input class="prop-input prop-input-sm" type="number" value="${m.x}" min="0" max="100" step="1" onchange="updMod('x',parseFloat(this.value))">
<span class="prop-label" style="width:30px">Y %</span><input class="prop-input prop-input-sm" type="number" value="${m.y}" min="0" max="100" step="1" onchange="updMod('y',parseFloat(this.value))"></div>
<div class="prop-row"><span class="prop-label">Alinear</span><select class="prop-select" onchange="updMod('textAlign',this.value)">
<option value="left"${m.textAlign==='left'?' selected':''}>Izquierda</option>
<option value="center"${m.textAlign==='center'?' selected':''}>Centro</option>
<option value="right"${m.textAlign==='right'?' selected':''}>Derecha</option>
</select></div>

<div class="prop-section-title" style="margin-top:10px">Tipografía</div>
<div class="prop-row"><span class="prop-label">Fuente</span><select class="prop-select" onchange="updMod('fontFamily',this.value)">
<option value="Manrope"${m.fontFamily==='Manrope'?' selected':''}>Manrope</option>
<option value="Inter"${m.fontFamily==='Inter'?' selected':''}>Inter</option>
</select></div>
<div class="prop-row"><span class="prop-label">Tamaño</span><input type="range" class="prop-range" min="8" max="120" value="${m.fontSize}" oninput="updMod('fontSize',parseInt(this.value));this.nextElementSibling.textContent=this.value+'px'"><span class="prop-range-val">${m.fontSize}px</span></div>
<div class="prop-row"><span class="prop-label">Peso</span><select class="prop-select" onchange="updMod('fontWeight',parseInt(this.value))">
<option value="300"${m.fontWeight===300?' selected':''}>Light 300</option>
<option value="400"${m.fontWeight===400?' selected':''}>Regular 400</option>
<option value="500"${m.fontWeight===500?' selected':''}>Medium 500</option>
<option value="600"${m.fontWeight===600?' selected':''}>Semi 600</option>
<option value="700"${m.fontWeight===700?' selected':''}>Bold 700</option>
<option value="800"${m.fontWeight===800?' selected':''}>Extra 800</option>
</select></div>
<div class="prop-row"><span class="prop-label">Color</span><input type="color" class="prop-color" value="${m.color}" onchange="updMod('color',this.value)"><span style="flex:1;font-size:.75rem;color:var(--text-dim)">${m.color}</span></div>
${m.type==='cta'?`<div class="prop-row"><span class="prop-label">BG Color</span><input type="color" class="prop-color" value="${m.bgColor||'#e7bf9c'}" onchange="updMod('bgColor',this.value)"></div>
<div class="prop-row"><span class="prop-label">Link</span><input class="prop-input" value="${esc(m.href||'#')}" onchange="updMod('href',this.value)"></div>`:''}
<div class="prop-row"><span class="prop-label">Spacing</span><input type="range" class="prop-range" min="-3" max="15" value="${m.letterSpacing}" oninput="updMod('letterSpacing',parseFloat(this.value));this.nextElementSibling.textContent=this.value"><span class="prop-range-val">${m.letterSpacing}</span></div>
<div class="prop-row"><span class="prop-label">Line H</span><input type="range" class="prop-range" min=".8" max="2.5" step=".05" value="${m.lineHeight}" oninput="updMod('lineHeight',parseFloat(this.value));this.nextElementSibling.textContent=this.value"><span class="prop-range-val">${m.lineHeight}</span></div>
<div class="prop-row"><span class="prop-label">Opacidad</span><input type="range" class="prop-range" min="0" max="1" step=".05" value="${m.opacity}" oninput="updMod('opacity',parseFloat(this.value));this.nextElementSibling.textContent=this.value"><span class="prop-range-val">${m.opacity}</span></div>

<div class="prop-section-title" style="margin-top:10px">Animación</div>
<div class="prop-row"><span class="prop-label">Entrada</span><select class="prop-select" onchange="updMod('animation',this.value)">
<option value="fade-up"${m.animation==='fade-up'?' selected':''}>Fade Up</option>
<option value="fade-down"${m.animation==='fade-down'?' selected':''}>Fade Down</option>
<option value="fade-left"${m.animation==='fade-left'?' selected':''}>Fade Left</option>
<option value="fade-right"${m.animation==='fade-right'?' selected':''}>Fade Right</option>
<option value="fade"${m.animation==='fade'?' selected':''}>Solo Fade</option>
<option value="scale-up"${m.animation==='scale-up'?' selected':''}>Scale Up</option>
<option value="blur-in"${m.animation==='blur-in'?' selected':''}>Blur In</option>
</select></div>
<div class="prop-row"><span class="prop-label">Delay</span><input class="prop-input prop-input-sm" type="number" value="${m.delay||0}" min="0" max=".5" step=".005" onchange="updMod('delay',parseFloat(this.value))"></div>

<div style="margin-top:12px;display:flex;justify-content:flex-end">
<button class="tb" style="color:var(--red)" onclick="deleteMod()"><span class="material-symbols-outlined" style="font-size:14px">delete</span> Módulo</button>
</div>`;
}
html+=`</div>`;
}
body.innerHTML=html;
}

function updClip(k,v){config.tracks[sel.track].clips[sel.clip][k]=v;autoSave();renderPreview();renderTimeline();}
function updMod(k,v){config.tracks[sel.track].clips[sel.clip].modules[sel.mod][k]=v;autoSave();renderPreview();renderProps();}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function addModToClip(){
const clip=config.tracks[sel.track].clips[sel.clip];
clip.modules.push({type:'body',content:'Nuevo texto',x:5,y:50,fontSize:16,fontFamily:'Inter',fontWeight:400,color:'#e2e2e2',letterSpacing:0,lineHeight:1.6,opacity:1,textAlign:'left',animation:'fade-up',delay:clip.modules.length*.01});
sel.mod=clip.modules.length-1;autoSave();renderProps();renderPreview();
}
function deleteMod(){
const clip=config.tracks[sel.track].clips[sel.clip];
if(clip.modules.length<=1)return;
clip.modules.splice(sel.mod,1);
sel.mod=Math.min(sel.mod,clip.modules.length-1);
autoSave();renderProps();renderPreview();
}

/* ── TIMELINE RENDER ── */
window.renderTimeline=function(){
const labelsEl=document.getElementById('tlLabels');
const tracksEl=document.getElementById('tlTracks');
const rulerEl=document.getElementById('tlRuler');
const wrap=document.getElementById('tlTracksWrap');
const wrapW=wrap.clientWidth;
const totalW=wrapW*zoom;

// Ruler
rulerEl.innerHTML='';rulerEl.style.width=totalW+'px';
const step=zoom>2?.05:zoom>1?.1:.2;
for(let p=0;p<=1;p+=step){
    const tick=document.createElement('div');
    tick.className='tl-ruler-tick';
    tick.style.left=(p*totalW)+'px';
    tick.innerHTML=`<span>${Math.round(p*100)}%</span>`;
    rulerEl.appendChild(tick);
}

// Labels & tracks
labelsEl.innerHTML='';tracksEl.innerHTML='';tracksEl.style.width=totalW+'px';
let totalH=0;

config.tracks.forEach((track,ti)=>{
    const isVideo=track.type==='video';
    const h=isVideo?48:36;
    totalH+=h;

    // Label
    const lbl=document.createElement('div');
    lbl.className='tl-label';
    lbl.style.height=h+'px';
    lbl.innerHTML=`
        <span class="tl-label-badge" style="background:${track.color||'#555'}">${isVideo?'V':ti}</span>
        <span class="tl-label-name">${track.name}</span>
        <button class="tb" style="padding:2px;border:none;background:none;color:${track.visible?'var(--text-dim)':'var(--red)'}" onclick="config.tracks[${ti}].visible=!config.tracks[${ti}].visible;autoSave();fullRender()">
            <span class="material-symbols-outlined" style="font-size:14px">${track.visible?'visibility':'visibility_off'}</span>
        </button>`;
    labelsEl.appendChild(lbl);

    // Track row
    const row=document.createElement('div');
    row.className='tl-track'+(isVideo?' tl-track-video':'');
    row.style.height=h+'px';
    row.dataset.ti=ti;

    // Video thumb strip
    if(isVideo&&thumbs.length){
        const strip=document.createElement('div');
        strip.className='tl-thumb-strip';
        strip.style.left='0';strip.style.width=totalW+'px';
        thumbs.forEach(t=>{const im=document.createElement('img');im.src=t.src;strip.appendChild(im);});
        row.appendChild(strip);
    }

    // Clips
    if(track.clips){
        track.clips.forEach((clip,ci)=>{
            const clipEl=document.createElement('div');
            clipEl.className='tl-clip'+(sel.track===ti&&sel.clip===ci?' selected':'');
            clipEl.style.left=(clip.start*totalW)+'px';
            clipEl.style.width=((clip.end-clip.start)*totalW)+'px';
            clipEl.style.background=track.color||CL[ti%CL.length];
            const label=clip.modules&&clip.modules[0]?clip.modules[0].content.substring(0,25):'clip';
            clipEl.textContent=label;
            clipEl.onmousedown=(e)=>{if(e.target.classList.contains('tl-clip-handle'))return;e.stopPropagation();selectClip(ti,ci);startDragClip(e,ti,ci);};
            // Resize handles
            const hl=document.createElement('div');hl.className='tl-clip-handle left';
            hl.onmousedown=(e)=>{e.stopPropagation();selectClip(ti,ci);startResizeClip(e,ti,ci,'start');};
            const hr=document.createElement('div');hr.className='tl-clip-handle right';
            hr.onmousedown=(e)=>{e.stopPropagation();selectClip(ti,ci);startResizeClip(e,ti,ci,'end');};
            clipEl.appendChild(hl);clipEl.appendChild(hr);
            row.appendChild(clipEl);
        });
    }

    // Click empty area to add clip
    row.addEventListener('dblclick',(e)=>{
        if(e.target!==row)return;
        const rect=row.getBoundingClientRect();
        const x=(e.clientX-rect.left+wrap.scrollLeft)/totalW;
        addClipAt(ti,x);
    });

    tracksEl.appendChild(row);
});

// Playhead
const ph=document.createElement('div');
ph.className='tl-playhead';
ph.style.left=(progress*totalW)+'px';
tracksEl.appendChild(ph);

tracksEl.style.height=totalH+'px';
};

function updatePlayhead(){
const wrap=document.getElementById('tlTracksWrap');
const totalW=wrap.clientWidth*zoom;
const ph=document.querySelector('.tl-playhead');
if(ph)ph.style.left=(progress*totalW)+'px';
}

/* ── CLIP DRAG ── */
let dragState=null;
function startDragClip(e,ti,ci){
const clip=config.tracks[ti].clips[ci];
const wrap=document.getElementById('tlTracksWrap');
const totalW=wrap.clientWidth*zoom;
const startX=e.clientX;
const origStart=clip.start,origEnd=clip.end;
dragState={type:'move',ti,ci,startX,origStart,origEnd,totalW,wrapRect:wrap.getBoundingClientRect(),wrapScroll:wrap.scrollLeft};
}
function startResizeClip(e,ti,ci,edge){
const clip=config.tracks[ti].clips[ci];
const wrap=document.getElementById('tlTracksWrap');
const totalW=wrap.clientWidth*zoom;
dragState={type:'resize',ti,ci,edge,startX:e.clientX,origVal:clip[edge],totalW,wrapRect:wrap.getBoundingClientRect(),wrapScroll:wrap.scrollLeft};
}
window.addEventListener('mousemove',(e)=>{
if(!dragState)return;
const dx=e.clientX-dragState.startX;
const dp=dx/dragState.totalW;
const clip=config.tracks[dragState.ti].clips[dragState.ci];
if(dragState.type==='move'){
    const dur=dragState.origEnd-dragState.origStart;
    let ns=Math.max(0,Math.min(1-dur,dragState.origStart+dp));
    clip.start=+ns.toFixed(4);clip.end=+(ns+dur).toFixed(4);
}else{
    let nv=Math.max(0,Math.min(1,dragState.origVal+dp));
    clip[dragState.edge]=+nv.toFixed(4);
    if(clip.start>=clip.end-.005){if(dragState.edge==='start')clip.start=clip.end-.005;else clip.end=clip.start+.005;}
}
renderTimeline();renderPreview();
});
window.addEventListener('mouseup',()=>{if(dragState){autoSave();dragState=null;}});

/* ── RULER CLICK ── */
document.getElementById('tlRuler').addEventListener('mousedown',(e)=>{
const wrap=document.getElementById('tlTracksWrap');
const totalW=wrap.clientWidth*zoom;
const rect=e.target.closest('.tl-ruler').getBoundingClientRect();
function upd(ev){progress=Math.max(0,Math.min(1,(ev.clientX-rect.left+wrap.scrollLeft)/totalW));renderPreview();}
upd(e);
const mv=(ev)=>upd(ev);const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
});

/* ── ZOOM ── */
window.zoomIn=()=>{zoom=Math.min(10,zoom*1.3);renderTimeline();};
window.zoomOut=()=>{zoom=Math.max(.5,zoom/1.3);renderTimeline();};
window.zoomFit=()=>{zoom=1;renderTimeline();};

/* ── TRACK/CLIP MANAGEMENT ── */
window.addTrack=function(){
config.tracks.push({id:'t'+Date.now(),name:'T'+(config.tracks.length),type:'text',visible:true,locked:false,color:CL[config.tracks.length%CL.length],clips:[]});
autoSave();renderTimeline();
};
function addClipAt(ti,x){
const s=+Math.max(0,x-.05).toFixed(2),e=+Math.min(1,x+.1).toFixed(2);
config.tracks[ti].clips.push({id:'c'+Date.now(),start:s,end:e,modules:[
{type:'headline',content:'Nuevo texto',x:5,y:50,fontSize:32,fontFamily:'Manrope',fontWeight:700,color:'#e2e2e2',letterSpacing:0,lineHeight:1.1,opacity:1,textAlign:'left',animation:'fade-up',delay:0}
]});
selectClip(ti,config.tracks[ti].clips.length-1);autoSave();
}
window.addClipToSelected=function(){addClipAt(selTrack>=0?selTrack:1,progress);};
window.deleteClip=function(){
if(sel.track<0||sel.clip<0)return;
config.tracks[sel.track].clips.splice(sel.clip,1);
clearSel();autoSave();renderTimeline();
};
window.duplicateClip=function(){
if(sel.track<0||sel.clip<0)return;
const orig=config.tracks[sel.track].clips[sel.clip];
const copy=JSON.parse(JSON.stringify(orig));
copy.id='c'+Date.now();copy.start=+Math.min(1,orig.end+.01).toFixed(3);copy.end=+Math.min(1,copy.start+(orig.end-orig.start)).toFixed(3);
config.tracks[sel.track].clips.push(copy);
selectClip(sel.track,config.tracks[sel.track].clips.length-1);autoSave();
};

/* ── PLAYBACK ── */
window.togglePlay=function(){
playing=!playing;
document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent=playing?'pause':'play_arrow';
if(playing){if(progress>=.99)progress=0;playInt=setInterval(()=>{progress+=.002;if(progress>=1){progress=1;togglePlay();}renderPreview();},16);}
else clearInterval(playInt);
};
function stopPlay(){if(playing){playing=false;clearInterval(playInt);document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent='play_arrow';}}
window.stepBack=()=>{stopPlay();progress=Math.max(0,progress-1/config.frameCount);renderPreview();};
window.stepForward=()=>{stopPlay();progress=Math.min(1,progress+1/config.frameCount);renderPreview();};
window.jumpTo=(p)=>{stopPlay();progress=p;renderPreview();};

/* ── FIREBASE ── */
let saveTimer=null;
window.autoSave=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveToFirebase(),1200);};
window.saveToFirebase=async function(){
if(!window._fb)return;
document.getElementById('syncDot').className='sync-dot';
try{await window._fb.setDoc(window._fb.D,JSON.parse(JSON.stringify(config)));document.getElementById('syncDot').className='sync-dot';}
catch(e){document.getElementById('syncDot').className='sync-dot err';console.error(e);}
};
function updSync(){document.getElementById('syncDot').className=window.syncOK?'sync-dot':'sync-dot err';}

/* ── JSON ── */
window.showJSON=()=>{document.getElementById('jsonCode').textContent=JSON.stringify(config,null,2);document.getElementById('jsonModal').style.display='flex';};
window.resetConfig=()=>{if(!confirm('Resetear?'))return;config=getDefault();fullRender();autoSave();};

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
if(e.key===' '){e.preventDefault();togglePlay();}
if(e.key==='ArrowLeft'){e.preventDefault();stepBack();}
if(e.key==='ArrowRight'){e.preventDefault();stepForward();}
if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteClip();}
if(e.key==='Escape')clearSel();
});

/* ── TIMELINE RESIZE ── */
const tlResize=document.getElementById('tlResize');
let tlDrag=false,tlStartY=0,tlStartH=0;
tlResize.addEventListener('mousedown',e=>{tlDrag=true;tlStartY=e.clientY;tlStartH=document.getElementById('timelinePanel').offsetHeight;});
window.addEventListener('mousemove',e=>{if(!tlDrag)return;const dy=tlStartY-e.clientY;document.getElementById('timelinePanel').style.height=Math.max(140,tlStartH+dy)+'px';});
window.addEventListener('mouseup',()=>{tlDrag=false;});

/* ── BOOT ── */
window.fullRender=function(){
document.getElementById('cfgHeight').value=config.scrollHeight;
document.getElementById('cfgOverlay').value=config.overlayOpacity;
renderTimeline();renderPreview();renderProps();updSync();
};
window.boot=function(){resizeCanvas();loadFrames();fullRender();};
// Fallback boot if Firebase fails
setTimeout(()=>{if(!framesOK)boot();},2000);
</script>
</body>
</html>

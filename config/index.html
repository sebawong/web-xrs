<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>XRS Hero — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a0a;--surface:#151515;--surface-2:#1e1e1e;--surface-3:#282828;--surface-4:#333;
--border:#2a2a2a;--border-2:#3a3a3a;--text:#e0e0e0;--text-dim:#888;--text-muted:#555;
--accent:#e7bf9c;--accent-dim:rgba(231,191,156,.12);--green:#3de273;--red:#e23d5e;--blue:#4aa8e8;--purple:#a87de2;
--font:'Inter',sans-serif;
--tl-label-w:170px;
}
html{font-size:13px}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;font-size:18px;vertical-align:middle}
.mi{font-family:'Material Symbols Outlined';font-size:16px;font-variation-settings:'FILL' 0,'wght' 300;vertical-align:middle}

/* ═══ TOOLBAR ═══ */
.toolbar{display:flex;align-items:center;height:40px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;gap:8px;flex-shrink:0}
.toolbar-brand{font-weight:700;font-size:.9rem;margin-right:12px;color:var(--accent)}
.toolbar-sep{width:1px;height:20px;background:var(--border-2);margin:0 4px}
.tb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:4px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font);font-size:.75rem;font-weight:500;cursor:pointer;transition:all 120ms}
.tb:hover{background:var(--surface-3);color:var(--text)}
.tb.active,.tb-accent{background:var(--accent);color:#1a1a1a}
.tb .material-symbols-outlined{font-size:16px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:2px}
.sync-dot.err{background:var(--red)}
.toolbar-spacer{flex:1}
.tb-timecode{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--accent);font-weight:600;padding:0 8px;min-width:100px;text-align:center}

/* ═══ MAIN LAYOUT ═══ */
.main{flex:1;display:flex;overflow:hidden}

/* ═══ PREVIEW ═══ */
.preview-panel{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
.preview-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
#previewCanvas{display:block;max-width:100%;max-height:100%}
.preview-overlay{position:absolute;pointer-events:none;z-index:1}
#previewTextLayer{position:absolute;z-index:10;pointer-events:none}

/* Preview text elements */
.pv-mod{position:absolute;pointer-events:none;transition:none;white-space:pre-line}
.pv-mod.selected{outline:1px solid var(--accent);outline-offset:4px;pointer-events:auto;cursor:move}

/* ═══ PROPERTIES PANEL ═══ */
.props-panel{width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.props-header{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:.8rem;display:flex;align-items:center;gap:8px}
.props-header .material-symbols-outlined{font-size:16px;color:var(--accent)}
.props-body{flex:1;overflow-y:auto;padding:0}
.props-empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:.82rem;line-height:1.6}
.prop-section{border-bottom:1px solid var(--border);padding:12px 14px}
.prop-section-title{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.prop-section-title .material-symbols-outlined{font-size:14px;color:var(--accent)}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prop-row:last-child{margin-bottom:0}
.prop-label{font-size:.78rem;width:70px;flex-shrink:0;color:var(--text-dim)}
.prop-input{flex:1;padding:5px 8px;border-radius:4px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:.8rem}
.prop-input:focus{outline:none;border-color:var(--accent)}
textarea.prop-input{resize:vertical;min-height:50px;line-height:1.4}
.prop-input-sm{width:56px;flex:none;text-align:center}
.prop-select{flex:1;padding:5px 8px;border-radius:4px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:.8rem;cursor:pointer}
.prop-select:focus{outline:none;border-color:var(--accent)}
.prop-color{width:28px;height:28px;border-radius:4px;border:1px solid var(--border-2);cursor:pointer;padding:0;background:none}
.prop-color::-webkit-color-swatch-wrapper{padding:2px}
.prop-color::-webkit-color-swatch{border:none;border-radius:2px}
.prop-range{flex:1;accent-color:var(--accent)}
.prop-range-val{width:36px;text-align:right;font-size:.75rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

/* ═══ TIMELINE — row-based with sticky labels ═══ */
.timeline-panel{height:260px;min-height:180px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.tl-toolbar{display:flex;align-items:center;height:32px;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.tl-toolbar .tb{padding:3px 6px;font-size:.7rem}

/* Single scroll container */
.tl-body{flex:1;overflow:auto;position:relative}

/* Each row = label (sticky) + track */
.tl-row{display:flex;align-items:stretch;min-width:fit-content}

/* Sticky label (left column) */
.tl-label{width:var(--tl-label-w);flex-shrink:0;position:sticky;left:0;z-index:5;background:var(--surface);border-right:1px solid var(--border)}

/* Track area */
.tl-track{flex:1;position:relative}

/* ── Ruler ── */
.tl-row-ruler{position:sticky;top:0;z-index:12}
.tl-row-ruler .tl-label{height:24px;background:var(--surface-2);border-bottom:1px solid var(--border);z-index:14}
.tl-row-ruler .tl-track{height:24px;background:var(--surface-2);border-bottom:1px solid var(--border);cursor:pointer}
.tl-ruler-tick{position:absolute;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px}
.tl-ruler-tick span{font-size:.55rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tl-ruler-tick::before{content:'';position:absolute;top:0;width:1px;height:6px;background:var(--border-2)}

/* ── Video track row ── */
.tl-row-video .tl-label{height:44px;display:flex;align-items:center;padding:0 8px;gap:5px;font-size:.7rem;font-weight:600;border-bottom:1px solid var(--border)}
.tl-row-video .tl-track{height:44px;border-bottom:1px solid var(--border)}
.tl-thumb-strip{position:absolute;top:2px;bottom:2px;left:0;display:flex;overflow:hidden;border-radius:3px;opacity:.45}
.tl-thumb-strip img{height:100%;width:auto;flex-shrink:0}

/* ── Group header row ── */
.tl-row-group .tl-label{height:26px;display:flex;align-items:center;padding:0 6px;gap:5px;cursor:pointer;background:var(--surface-2);font-size:.7rem;font-weight:600;border-bottom:1px solid var(--border)}
.tl-row-group .tl-label:hover{background:var(--surface-3)}
.tl-row-group .tl-track{height:26px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tl-group-chevron{font-size:14px;color:var(--text-dim);transition:transform 150ms}
.tl-group-chevron.collapsed{transform:rotate(-90deg)}
.tl-group-badge{width:18px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#000;flex-shrink:0}
.tl-group-name{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-group-actions{display:flex;gap:2px}
.tl-group-actions .tb{padding:1px 3px;border:none;background:none}

/* ── Module sub-row ── */
.tl-row-mod .tl-label{height:24px;display:flex;align-items:center;padding:0 8px 0 26px;gap:5px;font-size:.65rem;color:var(--text-dim);border-bottom:1px solid rgba(42,42,42,.5);overflow:hidden;white-space:nowrap;cursor:pointer}
.tl-row-mod .tl-label:hover{background:rgba(255,255,255,.03)}
.tl-row-mod .tl-label.selected{background:var(--accent-dim);color:var(--text)}
.tl-row-mod .tl-track{height:24px;border-bottom:1px solid rgba(42,42,42,.5)}
.tl-mod-type{font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 4px;border-radius:2px;background:var(--surface-3);color:var(--text-muted);flex-shrink:0}
.tl-mod-text{flex:1;overflow:hidden;text-overflow:ellipsis}

/* ── Clips ── */
.tl-clip{position:absolute;top:3px;bottom:3px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 8px;font-size:.55rem;font-weight:600;color:rgba(0,0,0,.85);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:box-shadow 100ms}
.tl-clip:hover{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.tl-clip.selected{box-shadow:0 0 0 2px var(--accent),0 0 10px rgba(231,191,156,.3)}
.tl-clip-handle{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.tl-clip-handle.left{left:0;border-radius:4px 0 0 4px}
.tl-clip-handle.right{right:0;border-radius:0 4px 4px 0}
.tl-clip-handle:hover{background:rgba(255,255,255,.25)}
.tl-clip-summary{opacity:.45;font-size:.5rem}

/* ── Playhead ── */
.tl-playhead{position:absolute;top:0;width:2px;background:var(--accent);z-index:20;pointer-events:none}
.tl-playhead::before{content:'';position:absolute;top:-2px;left:-5px;width:12px;height:8px;background:var(--accent);clip-path:polygon(0 0,100% 0,50% 100%)}

/* ── Resize handle ── */
.tl-resize{height:4px;cursor:ns-resize;background:transparent;flex-shrink:0}
.tl-resize:hover{background:var(--accent-dim)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:3px}
::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>

<!-- ═══ TOOLBAR ═══ -->
<div class="toolbar">
    <span class="toolbar-brand">XRS Editor</span>
    <div class="toolbar-sep"></div>
    <button class="tb" onclick="saveToFirebase()" title="Guardar"><span class="material-symbols-outlined">cloud_upload</span> Guardar</button>
    <div class="sync-dot" id="syncDot"></div>
    <div class="toolbar-sep"></div>
    <button class="tb" onclick="jumpTo(0)"><span class="material-symbols-outlined">skip_previous</span></button>
    <button class="tb" onclick="stepBack()"><span class="material-symbols-outlined">navigate_before</span></button>
    <button class="tb" id="btnPlay" onclick="togglePlay()"><span class="material-symbols-outlined">play_arrow</span></button>
    <button class="tb" onclick="stepForward()"><span class="material-symbols-outlined">navigate_next</span></button>
    <button class="tb" onclick="jumpTo(1)"><span class="material-symbols-outlined">skip_next</span></button>
    <span class="tb-timecode" id="timecode">00:00 / F001</span>
    <div class="toolbar-spacer"></div>
    <button class="tb" onclick="addTrack()"><span class="material-symbols-outlined">add</span> Track</button>
    <button class="tb" onclick="showJSON()"><span class="material-symbols-outlined">data_object</span></button>
    <button class="tb" onclick="resetConfig()"><span class="material-symbols-outlined">restart_alt</span></button>
    <div class="toolbar-sep"></div>
    <label class="tb" title="Scroll Height (vh)">
        <span class="material-symbols-outlined">height</span>
        <input type="number" id="cfgHeight" value="5" min="2" max="15" step=".5" style="width:40px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:3px;padding:2px 4px;font-size:.75rem;text-align:center" onchange="config.scrollHeight=parseFloat(this.value);autoSave()">
        vh
    </label>
    <label class="tb" title="Overlay Opacity">
        <span class="material-symbols-outlined">gradient</span>
        <input type="number" id="cfgOverlay" value=".75" min="0" max="1" step=".05" style="width:44px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:3px;padding:2px 4px;font-size:.75rem;text-align:center" onchange="config.overlayOpacity=parseFloat(this.value);autoSave();renderPreview()">
    </label>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
    <!-- Preview -->
    <div class="preview-panel">
        <div class="preview-wrap" id="previewWrap">
            <canvas id="previewCanvas"></canvas>
            <div class="preview-overlay" id="previewOverlay"></div>
            <div id="previewTextLayer"></div>
        </div>
    </div>

    <!-- Properties -->
    <div class="props-panel">
        <div class="props-header"><span class="material-symbols-outlined">tune</span> Propiedades</div>
        <div class="props-body" id="propsBody">
            <div class="props-empty">Seleccioná un clip en el timeline para editar sus propiedades.</div>
        </div>
    </div>
</div>

<!-- ═══ TIMELINE ═══ -->
<div class="tl-resize" id="tlResize"></div>
<div class="timeline-panel" id="timelinePanel">
    <div class="tl-toolbar">
        <button class="tb" onclick="zoomIn()"><span class="material-symbols-outlined">zoom_in</span></button>
        <button class="tb" onclick="zoomOut()"><span class="material-symbols-outlined">zoom_out</span></button>
        <button class="tb" onclick="zoomFit()"><span class="material-symbols-outlined">fit_screen</span></button>
        <div class="toolbar-spacer"></div>
        <button class="tb" onclick="addClipToSelected()" title="Agregar clip al track seleccionado"><span class="material-symbols-outlined">add_box</span> Clip</button>
        <button class="tb" onclick="addModToClip()" title="Agregar módulo al clip seleccionado"><span class="material-symbols-outlined">add</span> Módulo</button>
        <button class="tb" onclick="duplicateClip()" title="Duplicar clip seleccionado"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="tb" onclick="deleteClip()" title="Eliminar clip (Del)"><span class="material-symbols-outlined">delete</span></button>
    </div>
    <div class="tl-body" id="tlBody"></div>
</div>

<!-- JSON Modal -->
<div id="jsonModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center">
    <div style="background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:20px;width:90%;max-width:700px;max-height:80vh;overflow-y:auto">
        <h3 style="margin-bottom:12px;font-size:.95rem">Config JSON</h3>
        <pre id="jsonCode" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;font-size:.72rem;overflow-x:auto;white-space:pre-wrap;max-height:50vh;line-height:1.5"></pre>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
            <button class="tb" onclick="document.getElementById('jsonModal').style.display='none'">Cerrar</button>
            <button class="tb" onclick="navigator.clipboard.writeText(JSON.stringify(config,null,2))"><span class="material-symbols-outlined">content_copy</span> Copiar</button>
        </div>
    </div>
</div>

<!-- ═══ FIREBASE ═══ -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyAfQZ4RARhe-jTD3emW4JVTmS_HMYBbZ2E",authDomain:"xrs-landing.firebaseapp.com",projectId:"xrs-landing",storageBucket:"xrs-landing.firebasestorage.app",messagingSenderId:"225138279563",appId:"1:225138279563:web:50dcbb04dc3eea32cf008e"});
const db=getFirestore(app);const D=doc(db,'config','hero');
window._fb={db,D,setDoc,getDoc,onSnapshot};
async function load(){try{const s=await getDoc(D);if(s.exists()&&s.data().tracks){window.config=s.data();window.syncOK=true;window.boot();}else{await setDoc(D,JSON.parse(JSON.stringify(window.config)));window.syncOK=true;window.boot();}}catch(e){console.warn('FB load:',e);window.syncOK=false;window.boot();}}
let _lastPush='';
onSnapshot(D,s=>{if(s.exists()&&s.data().tracks){const d=s.data();const j=JSON.stringify(d);if(j!==_lastPush&&j!==JSON.stringify(window.config)){window.config=d;window.syncOK=true;window.fullRender();}}},e=>{window.syncOK=false;updSync();});
setTimeout(load,200);
</script>

/* ── FRAMES ── */
const frames=[],thumbs=[];let framesOK=false;
function loadFrames(){
    let n=0;frames.length=0;
    for(let i=1;i<=config.frameCount;i++){
        const img=new Image();
        img.src='../img/hero-frames/frame_'+String(i).padStart(4,'0')+'.jpg';
        img.onload=img.onerror=()=>{n++;if(n>=config.frameCount){framesOK=true;renderPreview();buildThumbs();}};
        frames.push(img);
    }
}
function buildThumbs(){
    thumbs.length=0;
    const step=Math.max(1,Math.floor(frames.length/20));
    for(let i=0;i<frames.length;i+=step){
        if(frames[i]&&frames[i].complete&&frames[i].naturalWidth)thumbs.push(frames[i]);
    }
    renderTimeline();
}

/* ── CANVAS ── */
const canvas=document.getElementById('previewCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){
const wrap=document.getElementById('previewWrap');
const ww=wrap.clientWidth,wh=wrap.clientHeight;
// Use first loaded frame's aspect ratio, fallback 16:9
let ar=16/9;
if(frames[0]&&frames[0].naturalWidth)ar=frames[0].naturalWidth/frames[0].naturalHeight;
let cw,ch;
if(ww/wh>ar){ch=wh;cw=Math.round(ch*ar);}else{cw=ww;ch=Math.round(cw/ar);}
canvas.width=cw;canvas.height=ch;
canvas.style.width=cw+'px';canvas.style.height=ch+'px';
// Sync overlay + text layer to canvas bounds
const ov=document.getElementById('previewOverlay');
const tl=document.getElementById('previewTextLayer');
const ox=Math.round((ww-cw)/2),oy=Math.round((wh-ch)/2);
[ov,tl].forEach(el=>{el.style.left=ox+'px';el.style.top=oy+'px';el.style.width=cw+'px';el.style.height=ch+'px';});
renderPreview();
}
window.addEventListener('resize',()=>{resizeCanvas();renderTimeline();});

/* ── RENDER PREVIEW ── */
window.renderPreview=function(){
if(!framesOK)return;
const fi=Math.min(frames.length-1,Math.max(0,Math.floor(progress*frames.length)));
const img=frames[fi];
if(img&&img.complete&&img.naturalWidth){
    const cw=canvas.width,ch=canvas.height,iw=img.naturalWidth,ih=img.naturalHeight;
    const cr=cw/ch,ir=iw/ih;
    let dx=0,dy=0,dw=cw,dh=ch;
    if(ir>cr){dw=ch*ir;dx=(cw-dw)/2;}else{dh=cw/ir;dy=(ch-dh)/2;}
    ctx.clearRect(0,0,cw,ch);ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh);
}
const o=config.overlayOpacity;
document.getElementById('previewOverlay').style.background=
    `linear-gradient(135deg,rgba(19,19,19,${o}) 0%,rgba(19,19,19,${o*.53}) 40%,rgba(19,19,19,${o*.2}) 100%)`;
const sec=(progress*21).toFixed(1);
document.getElementById('timecode').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}.${(sec%1*10).toFixed(0)} / F${String(fi+1).padStart(3,'0')}`;
renderTextLayer();
updatePlayhead();
};

function renderTextLayer(){
const layer=document.getElementById('previewTextLayer');
layer.innerHTML='';
config.tracks.forEach((track,ti)=>{
    if(track.type!=='text'||!track.visible)return;
    track.clips.forEach((clip,ci)=>{
        if(!clip.modules)return;
        clip.modules.forEach((m,mi)=>{
            const mStart=clip.start+(m.delay||0);
            const mEnd=clip.end;
            const fdIn=m.fadeIn||config.fadeDuration||.04;
            const fdOut=m.fadeOut||config.fadeDuration||.04;
            let op=0,tx=0,ty=0,sc=1,bl=0;
            if(progress>=mStart&&progress<=mEnd){
                const inP=Math.min(1,(progress-mStart)/fdIn);
                const outP=Math.min(1,(mEnd-progress)/fdOut);
                op=Math.min(inP,outP)*(m.opacity!=null?m.opacity:1);
                const ease=1-inP,dist=40;
                switch(m.animation){
                    case'fade-up':ty=dist*ease;break;case'fade-down':ty=-dist*ease;break;
                    case'fade-left':tx=dist*ease;break;case'fade-right':tx=-dist*ease;break;
                    case'scale-up':sc=.85+.15*inP;break;case'blur-in':bl=12*ease;break;
                }
            }
            if(op<=0)return;
            const d=document.createElement('div');
            d.className='pv-mod'+(sel.track===ti&&sel.clip===ci&&sel.mod===mi?' selected':'');
            d.style.left=m.x+'%';d.style.top=m.y+'%';
            d.style.opacity=op;
            d.style.transform=`translate(${m.textAlign==='center'?'-50%':'0'},0) translateX(${tx}px) translateY(${ty}px) scale(${sc})`;
            if(bl>0)d.style.filter=`blur(${bl}px)`;
            d.style.fontFamily=(m.fontFamily||'Inter')+', sans-serif';
            d.style.fontSize=(m.fontSize||16)*(canvas.clientWidth/1280)+'px';
            d.style.fontWeight=m.fontWeight||400;
            d.style.color=m.color||'#e2e2e2';
            d.style.letterSpacing=(m.letterSpacing||0)+'px';
            d.style.lineHeight=m.lineHeight||1.4;
            d.style.textAlign=m.textAlign||'left';
            if(m.textAlign==='right'){d.style.left='auto';d.style.right=(100-m.x)+'%';}
            if(m.type==='tag'||m.type==='cta'||m.type==='button'||m.type==='badge')d.style.textTransform='uppercase';

            if(m.type==='cta'&&m.bgColor){
                Object.assign(d.style,{background:m.bgColor,display:'inline-block',padding:'.8em 2.2em',borderRadius:'2px'});
            }
            if(m.type==='button'){
                Object.assign(d.style,{display:'inline-block',padding:'.7em 2em',borderRadius:'2px',border:'1.5px solid '+(m.borderColor||m.color||'#e7bf9c')});
            }
            if(m.type==='badge'&&m.bgColor){
                Object.assign(d.style,{background:m.bgColor,display:'inline-block',padding:'.4em 1.2em',borderRadius:'100px'});
            }

            d.textContent=m.content||'';
            d.onmousedown=(e)=>{e.stopPropagation();selectMod(ti,ci,mi);};
            layer.appendChild(d);
        });
    });
});
}

function updClip(k,v){config.tracks[sel.track].clips[sel.clip][k]=v;autoSave();renderPreview();renderTimeline();}
function updMod(k,v){
    config.tracks[sel.track].clips[sel.clip].modules[sel.mod][k]=v;
    autoSave();renderPreview();
    if(!['fontSize','letterSpacing','lineHeight','opacity','fadeIn','fadeOut'].includes(k)){renderProps();renderTimeline();}
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,' ');}

window.addModToClip=function(){
if(sel.track<0||sel.clip<0)return;
const clip=config.tracks[sel.track].clips[sel.clip];
clip.modules.push({type:'body',content:'Nuevo texto',x:5,y:50,fontSize:16,fontFamily:'Inter',fontWeight:400,color:'#e2e2e2',letterSpacing:0,lineHeight:1.6,opacity:1,textAlign:'left',animation:'fade-up',delay:clip.modules.length*.01,fadeIn:.04,fadeOut:.04});
sel.mod=clip.modules.length-1;autoSave();renderProps();renderPreview();renderTimeline();
};
function deleteMod(){
const clip=config.tracks[sel.track].clips[sel.clip];
if(clip.modules.length<=1)return;
clip.modules.splice(sel.mod,1);
sel.mod=Math.min(sel.mod,clip.modules.length-1);
autoSave();renderProps();renderPreview();renderTimeline();
}

/* ── COLLAPSE STATE ── */
let collapsed={};

/* ══════════════════════════════════════════════════════════
   TIMELINE — row-based layout with sticky labels
   Each row = .tl-row > .tl-label (sticky left:0) + .tl-track
   Single scroll container = perfect alignment guaranteed
   ══════════════════════════════════════════════════════════ */
window.renderTimeline=function(){
const body=document.getElementById('tlBody');
const bodyW=body.clientWidth - 170; // approx track area width
const totalW=Math.max(bodyW,400)*zoom;
body.innerHTML='';

// ── Ruler row (sticky top) ──
const rulerRow=document.createElement('div');
rulerRow.className='tl-row tl-row-ruler';
const rulerLabel=document.createElement('div');
rulerLabel.className='tl-label';
const rulerTrack=document.createElement('div');
rulerTrack.className='tl-track';rulerTrack.id='tlRuler';
rulerTrack.style.width=totalW+'px';
const step=zoom>2?.05:zoom>1?.1:.2;
for(let p=0;p<=1;p+=step){
    const tick=document.createElement('div');tick.className='tl-ruler-tick';
    tick.style.left=(p*totalW)+'px';tick.innerHTML=`<span>${Math.round(p*100)}%</span>`;
    rulerTrack.appendChild(tick);
}
rulerRow.appendChild(rulerLabel);rulerRow.appendChild(rulerTrack);
body.appendChild(rulerRow);

// ── Rows container (for playhead positioning) ──
const rowsWrap=document.createElement('div');
rowsWrap.id='tlRows';rowsWrap.style.position='relative';

config.tracks.forEach((track,ti)=>{
    const isVideo=track.type==='video';
    const color=track.color||CL[ti%CL.length];
    const isCol=collapsed[track.id];

    if(isVideo){
        const row=document.createElement('div');row.className='tl-row tl-row-video';
        const lbl=document.createElement('div');lbl.className='tl-label';
        lbl.innerHTML=`<span class="tl-group-badge" style="background:#555">V</span><span class="tl-group-name">${track.name}</span>`;
        const trk=document.createElement('div');trk.className='tl-track';trk.style.width=totalW+'px';
        if(thumbs.length){
            const strip=document.createElement('div');strip.className='tl-thumb-strip';
            strip.style.width=totalW+'px';
            thumbs.forEach(t=>{const im=document.createElement('img');im.src=t.src;strip.appendChild(im);});
            trk.appendChild(strip);
        }
        row.appendChild(lbl);row.appendChild(trk);
        rowsWrap.appendChild(row);
        return;
    }

    // ── Group header row ──
    const grpRow=document.createElement('div');grpRow.className='tl-row tl-row-group';
    const grpLabel=document.createElement('div');grpLabel.className='tl-label';
    grpLabel.innerHTML=`
        <span class="material-symbols-outlined tl-group-chevron${isCol?' collapsed':''}">${isCol?'chevron_right':'expand_more'}</span>
        <span class="tl-group-badge" style="background:${color}">${ti}</span>
        <span class="tl-group-name">${track.name}</span>
        <div class="tl-group-actions">
            <button class="tb" style="padding:1px 3px;border:none;background:none;color:${track.visible?'var(--text-dim)':'var(--red)'}" onclick="event.stopPropagation();config.tracks[${ti}].visible=!config.tracks[${ti}].visible;autoSave();fullRender()">
                <span class="material-symbols-outlined" style="font-size:13px">${track.visible?'visibility':'visibility_off'}</span>
            </button>
        </div>`;
    grpLabel.onclick=()=>{collapsed[track.id]=!collapsed[track.id];renderTimeline();};
    const grpTrack=document.createElement('div');grpTrack.className='tl-track';grpTrack.style.width=totalW+'px';

    // Summary clips when collapsed
    if(isCol&&track.clips){
        track.clips.forEach((clip,ci)=>{
            const c=document.createElement('div');
            c.className='tl-clip tl-clip-summary';
            c.style.left=(clip.start*totalW)+'px';c.style.width=((clip.end-clip.start)*totalW)+'px';
            c.style.background=color;
            c.textContent=clip.modules?clip.modules.length+' mod':'';
            c.onmousedown=(e)=>{e.stopPropagation();selectClip(ti,ci);startDragClip(e,ti,ci,totalW);};
            addHandles(c,ti,ci,totalW);
            grpTrack.appendChild(c);
        });
    }
    grpRow.appendChild(grpLabel);grpRow.appendChild(grpTrack);
    rowsWrap.appendChild(grpRow);

    // ── Module sub-rows (when expanded) ──
    if(!isCol&&track.clips){
        track.clips.forEach((clip,ci)=>{
            if(!clip.modules)return;
            clip.modules.forEach((mod,mi)=>{
                const row=document.createElement('div');row.className='tl-row tl-row-mod';
                const lbl=document.createElement('div');
                lbl.className='tl-label'+(sel.track===ti&&sel.clip===ci&&sel.mod===mi?' selected':'');
                const mt=MOD_TYPES[mod.type];
                lbl.innerHTML=`<span class="tl-mod-type">${mt?mt.label:mod.type}</span><span class="tl-mod-text">${escH(mod.content).substring(0,18)}</span>`;
                lbl.onclick=()=>selectMod(ti,ci,mi);

                const trk=document.createElement('div');trk.className='tl-track';trk.style.width=totalW+'px';
                const modStart=clip.start+(mod.delay||0);
                const modEnd=clip.end;
                const clipEl=document.createElement('div');
                clipEl.className='tl-clip'+(sel.track===ti&&sel.clip===ci&&sel.mod===mi?' selected':'');
                clipEl.style.left=(modStart*totalW)+'px';
                clipEl.style.width=(Math.max(0,modEnd-modStart)*totalW)+'px';
                clipEl.style.background=color;
                clipEl.textContent=(mod.content||'').replace(/\n/g,' ').substring(0,30);
                clipEl.onmousedown=(e)=>{
                    if(e.target.classList.contains('tl-clip-handle'))return;
                    e.stopPropagation();selectMod(ti,ci,mi);
                    startDragMod(e,ti,ci,mi,totalW);
                };
                // Left handle = delay, Right handle = clip end
                const hl=document.createElement('div');hl.className='tl-clip-handle left';
                hl.onmousedown=(e)=>{e.stopPropagation();selectMod(ti,ci,mi);startResizeModDelay(e,ti,ci,mi,totalW);};
                const hr=document.createElement('div');hr.className='tl-clip-handle right';
                hr.onmousedown=(e)=>{e.stopPropagation();selectMod(ti,ci,mi);startResizeClip(e,ti,ci,'end',totalW);};
                clipEl.appendChild(hl);clipEl.appendChild(hr);
                trk.appendChild(clipEl);

                trk.addEventListener('dblclick',(e)=>{if(e.target===trk)addClipAt(ti,progress);});

                row.appendChild(lbl);row.appendChild(trk);
                rowsWrap.appendChild(row);
            });
        });

        if(!track.clips.length){
            const row=document.createElement('div');row.className='tl-row tl-row-mod';
            const lbl=document.createElement('div');lbl.className='tl-label';
            lbl.innerHTML='<span class="tl-mod-text" style="color:var(--text-muted);font-style:italic;padding-left:26px">doble click para agregar</span>';
            const trk=document.createElement('div');trk.className='tl-track';trk.style.width=totalW+'px';
            trk.addEventListener('dblclick',()=>{addClipAt(ti,progress);});
            row.appendChild(lbl);row.appendChild(trk);
            rowsWrap.appendChild(row);
        }
    }
});

// Playhead (spans all rows)
const ph=document.createElement('div');ph.className='tl-playhead';
ph.style.left=(progress*totalW+170)+'px'; // offset by label width
ph.style.top='0';ph.style.bottom='0';ph.style.position='absolute';
rowsWrap.appendChild(ph);

body.appendChild(rowsWrap);
};

function addHandles(clipEl,ti,ci,totalW){
    const hl=document.createElement('div');hl.className='tl-clip-handle left';
    hl.onmousedown=(e)=>{e.stopPropagation();selectClip(ti,ci);startResizeClip(e,ti,ci,'start',totalW);};
    const hr=document.createElement('div');hr.className='tl-clip-handle right';
    hr.onmousedown=(e)=>{e.stopPropagation();selectClip(ti,ci);startResizeClip(e,ti,ci,'end',totalW);};
    clipEl.appendChild(hl);clipEl.appendChild(hr);
}

function updatePlayhead(){
const body=document.getElementById('tlBody');
const bodyW=body.clientWidth - 170;
const totalW=Math.max(bodyW,400)*zoom;
const ph=document.querySelector('.tl-playhead');
if(ph)ph.style.left=(progress*totalW+170)+'px';
}

/* ── DRAG HANDLERS ── */
let dragState=null;

function startDragMod(e,ti,ci,mi,totalW){
const mod=config.tracks[ti].clips[ci].modules[mi];
const clip=config.tracks[ti].clips[ci];
dragState={type:'mod-move',ti,ci,mi,startX:e.clientX,origDelay:mod.delay||0,clipStart:clip.start,clipEnd:clip.end,totalW};
}
function startResizeModDelay(e,ti,ci,mi,totalW){
const mod=config.tracks[ti].clips[ci].modules[mi];
const clip=config.tracks[ti].clips[ci];
dragState={type:'mod-delay',ti,ci,mi,startX:e.clientX,origDelay:mod.delay||0,clipStart:clip.start,clipEnd:clip.end,totalW};
}
function startDragClip(e,ti,ci,totalW){
const clip=config.tracks[ti].clips[ci];
dragState={type:'move',ti,ci,startX:e.clientX,origStart:clip.start,origEnd:clip.end,totalW};
}
function startResizeClip(e,ti,ci,edge,totalW){
const clip=config.tracks[ti].clips[ci];
dragState={type:'resize',ti,ci,edge,startX:e.clientX,origVal:clip[edge],totalW};
}

window.addEventListener('mousemove',(e)=>{
if(!dragState)return;
const dx=e.clientX-dragState.startX;
const dp=dx/dragState.totalW;
const clip=config.tracks[dragState.ti].clips[dragState.ci];
if(dragState.type==='move'){
    const dur=dragState.origEnd-dragState.origStart;
    let ns=Math.max(0,Math.min(1-dur,dragState.origStart+dp));
    clip.start=+ns.toFixed(4);clip.end=+(ns+dur).toFixed(4);
}else if(dragState.type==='resize'){
    let nv=Math.max(0,Math.min(1,dragState.origVal+dp));
    clip[dragState.edge]=+nv.toFixed(4);
    if(clip.start>=clip.end-.005){if(dragState.edge==='start')clip.start=clip.end-.005;else clip.end=clip.start+.005;}
}else if(dragState.type==='mod-move'||dragState.type==='mod-delay'){
    const mod=clip.modules[dragState.mi];
    let nd=Math.max(0,dragState.origDelay+dp);
    if(dragState.clipStart+nd>=dragState.clipEnd-.005)nd=dragState.clipEnd-dragState.clipStart-.005;
    mod.delay=+nd.toFixed(4);
}
renderTimeline();renderPreview();
});
window.addEventListener('mouseup',()=>{if(dragState){autoSave();dragState=null;}});

/* ── RULER CLICK ── */
document.getElementById('tlBody').addEventListener('mousedown',(e)=>{
const rulerTrack=document.getElementById('tlRuler');
if(!rulerTrack||!rulerTrack.contains(e.target))return;
const body=document.getElementById('tlBody');
const bodyW=body.clientWidth - 170;
const totalW=Math.max(bodyW,400)*zoom;
const rect=rulerTrack.getBoundingClientRect();
function upd(ev){progress=Math.max(0,Math.min(1,(ev.clientX-rect.left+body.scrollLeft)/totalW));renderPreview();}
upd(e);
const mv=(ev)=>upd(ev);const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
});

/* ── ZOOM ── */
window.zoomIn=()=>{zoom=Math.min(10,zoom*1.3);renderTimeline();};
window.zoomOut=()=>{zoom=Math.max(.5,zoom/1.3);renderTimeline();};
window.zoomFit=()=>{zoom=1;renderTimeline();};

/* ── TRACK/CLIP MANAGEMENT ── */
window.addTrack=function(){
config.tracks.push({id:'t'+Date.now(),name:'T'+(config.tracks.length),type:'text',visible:true,locked:false,color:CL[config.tracks.length%CL.length],clips:[]});
autoSave();renderTimeline();
};
function addClipAt(ti,x){
const s=+Math.max(0,x-.05).toFixed(2),e=+Math.min(1,x+.1).toFixed(2);
config.tracks[ti].clips.push({id:'c'+Date.now(),start:s,end:e,modules:[
{type:'headline',content:'Nuevo texto',x:5,y:50,fontSize:32,fontFamily:'Manrope',fontWeight:700,color:'#e2e2e2',letterSpacing:0,lineHeight:1.1,opacity:1,textAlign:'left',animation:'fade-up',delay:0,fadeIn:.04,fadeOut:.04}
]});
selectClip(ti,config.tracks[ti].clips.length-1);autoSave();
}
window.addClipToSelected=function(){addClipAt(selTrack>=0?selTrack:1,progress);};
window.deleteClip=function(){
if(sel.track<0||sel.clip<0)return;
config.tracks[sel.track].clips.splice(sel.clip,1);
clearSel();autoSave();renderTimeline();
};
window.duplicateClip=function(){
if(sel.track<0||sel.clip<0)return;
const orig=config.tracks[sel.track].clips[sel.clip];
const copy=JSON.parse(JSON.stringify(orig));
copy.id='c'+Date.now();copy.start=+Math.min(1,orig.end+.01).toFixed(3);copy.end=+Math.min(1,copy.start+(orig.end-orig.start)).toFixed(3);
config.tracks[sel.track].clips.push(copy);
selectClip(sel.track,config.tracks[sel.track].clips.length-1);autoSave();
};

/* ── PLAYBACK ── */
window.togglePlay=function(){
playing=!playing;
document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent=playing?'pause':'play_arrow';
if(playing){if(progress>=.99)progress=0;playInt=setInterval(()=>{progress+=.002;if(progress>=1){progress=1;togglePlay();}renderPreview();},16);}
else clearInterval(playInt);
};
function stopPlay(){if(playing){playing=false;clearInterval(playInt);document.getElementById('btnPlay').querySelector('.material-symbols-outlined').textContent='play_arrow';}}
window.stepBack=()=>{stopPlay();progress=Math.max(0,progress-1/config.frameCount);renderPreview();};
window.stepForward=()=>{stopPlay();progress=Math.min(1,progress+1/config.frameCount);renderPreview();};
window.jumpTo=(p)=>{stopPlay();progress=p;renderPreview();};

/* ── FIREBASE ── */
let saveTimer=null;let lastSave=0;
window.autoSave=()=>{
    clearTimeout(saveTimer);
    const now=Date.now();
    const delay=dragState?100:0;
    if(now-lastSave<delay){saveTimer=setTimeout(()=>autoSave(),delay);return;}
    lastSave=now;saveToFirebase();
};
window.saveToFirebase=async function(){
if(!window._fb)return;
document.getElementById('syncDot').className='sync-dot';
try{const d=JSON.parse(JSON.stringify(config));window._lastPush=JSON.stringify(d);await window._fb.setDoc(window._fb.D,d);document.getElementById('syncDot').className='sync-dot';}
catch(e){document.getElementById('syncDot').className='sync-dot err';console.error(e);}
};
function updSync(){document.getElementById('syncDot').className=window.syncOK?'sync-dot':'sync-dot err';}

/* ── JSON ── */
window.showJSON=()=>{document.getElementById('jsonCode').textContent=JSON.stringify(config,null,2);document.getElementById('jsonModal').style.display='flex';};
window.resetConfig=()=>{if(!confirm('Resetear?'))return;config=getDefault();fullRender();autoSave();};

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
if(e.key===' '){e.preventDefault();togglePlay();}
if(e.key==='ArrowLeft'){e.preventDefault();stepBack();}
if(e.key==='ArrowRight'){e.preventDefault();stepForward();}
if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteClip();}
if(e.key==='Escape')clearSel();
});

/* ── TIMELINE RESIZE ── */
const tlResize=document.getElementById('tlResize');
let tlDrag=false,tlStartY=0,tlStartH=0;
tlResize.addEventListener('mousedown',e=>{tlDrag=true;tlStartY=e.clientY;tlStartH=document.getElementById('timelinePanel').offsetHeight;});
window.addEventListener('mousemove',e=>{if(!tlDrag)return;const dy=tlStartY-e.clientY;document.getElementById('timelinePanel').style.height=Math.max(140,tlStartH+dy)+'px';});
window.addEventListener('mouseup',()=>{tlDrag=false;});

/* ── BOOT ── */
window.fullRender=function(){
document.getElementById('cfgHeight').value=config.scrollHeight;
document.getElementById('cfgOverlay').value=config.overlayOpacity;
renderTimeline();renderPreview();renderProps();updSync();
};
window.boot=function(){resizeCanvas();loadFrames();fullRender();};
setTimeout(()=>{if(!framesOK)boot();},2000);
</script>
</body>
</html>
